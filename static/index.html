<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>__ROOT_DIR_NAME__ - RepoView</title>
        <style>
            /* ── Theme Variables ──────────────────────────────────────── */
            :root,
            [data-theme="light"] {
                color-scheme: light;
                /* Obsidian default light palette. */
                --rv-bg: #ffffff;
                --rv-bg-secondary: #f2f3f5;
                --rv-bg-tertiary: #e3e5e8;
                --rv-bg-hover: #e9e9e9;
                --rv-bg-active: #7b6cd91f;
                --rv-border: #dddddd;
                --rv-border-active: #7b6cd9;
                --rv-text: #222222;
                --rv-text-secondary: #5c5c5c;
                --rv-text-tertiary: #707070;
                --rv-link: #705dcf;
                --rv-icon-folder: #7b6cd9;
                --rv-resize-handle: #705dcf40;
                --rv-scrollbar-thumb: #dadada;
                --rv-scrollbar-thumb-hover: #bdbdbd;
                --rv-overlay: #00000040;
                --rv-shadow: rgba(0, 0, 0, 0.12);
                --rv-shadow-strong: rgba(0, 0, 0, 0.15);
                --rv-error-bg: #fbe4e4;
                --rv-error-border: #f2bdbd;
                --rv-error-text: #d1383d;
                --rv-error-btn-hover: #a1363c;
                --rv-warning-bg: #fff8dd;
                --rv-warning-border: #d4a72c;
                --rv-warning-text: #6a4c05;
                /* Code (chroma) token families. */
                --rv-code-key: #cf222e;
                --rv-code-str: #0a3069;
                --rv-code-num: #0550ae;
                --rv-code-com: #6e7781;
                --rv-code-fn: #8250df;
                --rv-code-cls: #953800;
                --rv-code-tag: #116329;
                --rv-code-attr: #953800;
                --rv-code-op: #57606a;
            }
            [data-theme="dark"] {
                color-scheme: dark;
                --rv-bg: #1e1e2e;
                --rv-bg-secondary: #262637;
                --rv-bg-tertiary: #313244;
                --rv-bg-hover: #353548;
                --rv-bg-active: #2a3a50;
                --rv-border: #3b3b52;
                --rv-border-active: #5b8dd9;
                --rv-text: #cdd6f4;
                --rv-text-secondary: #9399b2;
                --rv-text-tertiary: #6c7086;
                --rv-link: #89b4fa;
                --rv-icon-folder: #89b4fa;
                --rv-resize-handle: #89b4fa40;
                --rv-scrollbar-thumb: #3b3b52;
                --rv-scrollbar-thumb-hover: #5a5a78;
                --rv-overlay: #00000080;
                --rv-shadow: rgba(0, 0, 0, 0.3);
                --rv-shadow-strong: rgba(0, 0, 0, 0.4);
                --rv-error-bg: #3b1d26;
                --rv-error-border: #5c3040;
                --rv-error-text: #f38ba8;
                --rv-error-btn-hover: #a02d40;
                --rv-warning-bg: #3b3520;
                --rv-warning-border: #8a7530;
                --rv-warning-text: #e0c080;
                /* Code (chroma) token families. */
                --rv-code-key: #cba6f7;
                --rv-code-str: #a6e3a1;
                --rv-code-num: #fab387;
                --rv-code-com: #6c7086;
                --rv-code-fn: #89b4fa;
                --rv-code-cls: #f9e2af;
                --rv-code-tag: #f38ba8;
                --rv-code-attr: #f9e2af;
                --rv-code-op: #94e2d5;
            }
            /* Nord (colored theme 1) — official Nord palette
               https://www.nordtheme.com/docs/colors-and-palettes */
            [data-theme="nord"] {
                color-scheme: dark;
                --rv-bg: #2e3440;
                --rv-bg-secondary: #3b4252;
                --rv-bg-tertiary: #3b4252;
                --rv-bg-hover: #434c5e;
                --rv-bg-active: #4c566a;
                --rv-border: #434c5e;
                --rv-border-active: #88c0d0;
                --rv-text: #d8dee9;
                --rv-text-secondary: #d8dee9b3;
                --rv-text-tertiary: #d8dee980;
                --rv-link: #88c0d0;
                --rv-icon-folder: #81a1c1;
                --rv-resize-handle: #88c0d040;
                --rv-scrollbar-thumb: #434c5e;
                --rv-scrollbar-thumb-hover: #4c566a;
                --rv-overlay: #00000080;
                --rv-shadow: rgba(0, 0, 0, 0.3);
                --rv-shadow-strong: rgba(0, 0, 0, 0.4);
                --rv-error-bg: #463639;
                --rv-error-border: #5e4a4d;
                --rv-error-text: #bf616a;
                --rv-error-btn-hover: #8b5259;
                --rv-warning-bg: #43483a;
                --rv-warning-border: #6d7444;
                --rv-warning-text: #ebcb8b;
                /* Code (chroma) token families. */
                --rv-code-key: #81a1c1;
                --rv-code-str: #a3be8c;
                --rv-code-num: #b48ead;
                --rv-code-com: #616e88;
                --rv-code-fn: #88c0d0;
                --rv-code-cls: #8fbcbb;
                --rv-code-tag: #8fbcbb;
                --rv-code-attr: #ebcb8b;
                --rv-code-op: #81a1c1;
            }
            /* OpenCode Orng (colored theme 2) — from the OpenCode "Orng"
               colorway (https://opencode.ai/theme): neutral #0a0a0a base,
               ink #eeeeee, orange #ec5b2b accent. */
            [data-theme="opencode"] {
                color-scheme: dark;
                --rv-bg: #0a0a0a;
                --rv-bg-secondary: #171717;
                --rv-bg-tertiary: #1e1e1e;
                --rv-bg-hover: #242424;
                --rv-bg-active: #2a2a2a;
                --rv-border: #383838;
                --rv-border-active: #ec5b2b;
                --rv-text: #eeeeee;
                --rv-text-secondary: #a3a3a3;
                --rv-text-tertiary: #808080;
                --rv-link: #ec5b2b;
                --rv-icon-folder: #ee7948;
                --rv-resize-handle: #ec5b2b40;
                --rv-scrollbar-thumb: #383838;
                --rv-scrollbar-thumb-hover: #484848;
                --rv-overlay: #00000085;
                --rv-shadow: rgba(0, 0, 0, 0.4);
                --rv-shadow-strong: rgba(0, 0, 0, 0.5);
                --rv-error-bg: #2a1416;
                --rv-error-border: #4a2023;
                --rv-error-text: #e06c75;
                --rv-error-btn-hover: #a2434a;
                --rv-warning-bg: #2a2417;
                --rv-warning-border: #6b5c2a;
                --rv-warning-text: #e5c07b;
                /* Code (chroma) token families. */
                --rv-code-key: #ec5b2b;
                --rv-code-str: #6ba1e6;
                --rv-code-num: #ee7948;
                --rv-code-com: #808080;
                --rv-code-fn: #56b6c2;
                --rv-code-cls: #e5c07b;
                --rv-code-tag: #e06c75;
                --rv-code-attr: #e5c07b;
                --rv-code-op: #eeeeee;
            }

            /* ── Reset & Base ─────────────────────────────────────────── */
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            html,
            body {
                height: 100%;
                overflow: hidden;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
                    Helvetica, Arial, sans-serif;
                font-size: 14px;
                line-height: 1.5;
                color: var(--rv-text);
                background: var(--rv-bg);
            }
            a {
                color: var(--rv-link);
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }

            /* ── Layout ───────────────────────────────────────────────── */
            #app {
                display: flex;
                height: 100vh;
            }
            #sidebar {
                width: 250px;
                min-width: 140px;
                max-width: 50vw;
                background: var(--rv-bg-secondary);
                border-right: 1px solid var(--rv-border);
                display: flex;
                flex-direction: column;
                flex-shrink: 0;
                overflow: hidden;
                position: relative;
            }
            #sidebar-header {
                padding: 12px 16px;
                border-bottom: 1px solid var(--rv-border);
                font-weight: 600;
                font-size: 14px;
                display: flex;
                align-items: center;
                gap: 8px;
                flex-shrink: 0;
            }
            #sidebar-header .repo-icon {
                color: var(--rv-text-secondary);
            }
            #tree-container {
                flex: 1;
                overflow-y: auto;
                padding: 4px 0;
            }
            #resize-handle {
                position: absolute;
                top: 0;
                right: -3px;
                width: 6px;
                height: 100%;
                cursor: col-resize;
                z-index: 10;
            }
            #resize-handle:hover,
            #resize-handle.active {
                background: var(--rv-resize-handle);
            }

            #main {
                flex: 1;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                min-width: 0;
            }
            #content-wrapper {
                flex: 1;
                display: flex;
                overflow: hidden;
            }
            #breadcrumb-bar {
                position: sticky;
                top: 0;
                z-index: 5;
                padding: 8px 24px;
                border-bottom: 1px solid var(--rv-border);
                background: var(--rv-bg);
                display: flex;
                align-items: center;
                gap: 4px;
                font-size: 14px;
                flex-shrink: 0;
                flex-wrap: wrap;
            }
            #breadcrumb-bar .sep {
                color: var(--rv-text-secondary);
                margin: 0 2px;
            }
            #breadcrumb-bar .crumb {
                cursor: pointer;
                color: var(--rv-link);
            }
            #breadcrumb-bar .crumb:hover {
                text-decoration: underline;
            }
            #breadcrumb-bar .crumb.current {
                color: var(--rv-text);
                font-weight: 600;
                cursor: default;
            }
            #breadcrumb-bar .crumb.current:hover {
                text-decoration: none;
            }
            #go-to-file-btn {
                margin: 8px 12px 4px;
                padding: 5px 12px;
                font-size: 12px;
                width: calc(100% - 24px);
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                background: var(--rv-bg);
                color: var(--rv-text-secondary);
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 6px;
                flex-shrink: 0;
            }
            #go-to-file-btn:hover {
                background: var(--rv-bg-hover);
            }
            #go-to-file-btn kbd {
                font-family: inherit;
                font-size: 11px;
                padding: 0 4px;
                border: 1px solid var(--rv-border);
                border-radius: 3px;
                background: var(--rv-bg);
            }
            #content-area {
                flex: 1;
                overflow-y: auto;
                padding: 24px 24px 24px 48px;
                min-width: 0;
            }

            /* ── Welcome ──────────────────────────────────────────────── */
            .welcome {
                color: var(--rv-text-secondary);
                text-align: center;
                margin-top: 120px;
            }
            .welcome h2 {
                font-size: 20px;
                margin-bottom: 8px;
                color: var(--rv-text);
            }

            /* ── Dir listing ──────────────────────────────────────────── */
            .dir-listing {
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                overflow: hidden;
            }
            .dir-listing-row {
                display: flex;
                align-items: center;
                padding: 8px 16px;
                gap: 8px;
                border-bottom: 1px solid var(--rv-border);
                cursor: pointer;
                font-size: 14px;
            }
            .dir-listing-row:last-child {
                border-bottom: none;
            }
            .dir-listing-row:hover {
                background: var(--rv-bg-secondary);
            }
            .dir-listing-row .icon {
                flex-shrink: 0;
                color: var(--rv-icon-folder);
                width: 16px;
            }
            .dir-listing-row .icon.folder {
                color: var(--rv-icon-folder);
            }
            .dir-listing-row .icon.file {
                color: var(--rv-text-secondary);
            }
            .dir-listing-row .name {
                flex: 1;
            }
            .dir-listing-row .size,
            .dir-listing-row .modified {
                color: var(--rv-text-secondary);
                font-size: 12px;
                flex-shrink: 0;
            }
            .dir-listing-row .size {
                width: 70px;
                text-align: right;
            }
            .dir-listing-row .modified {
                width: 140px;
                text-align: right;
            }

            /* ── Tree ─────────────────────────────────────────────────── */
            .tree-item {
                display: flex;
                align-items: center;
                padding: 4px 8px;
                cursor: pointer;
                gap: 4px;
                white-space: nowrap;
                border-radius: 6px;
                margin: 1px 4px;
                font-size: 14px;
            }
            .tree-item:hover {
                background: var(--rv-bg-hover);
            }
            .tree-item.active {
                background: var(--rv-bg-active);
            }
            .tree-item .icon {
                flex-shrink: 0;
                width: 16px;
                height: 16px;
                color: var(--rv-text-secondary);
            }
            .tree-item .icon.folder-icon {
                color: var(--rv-icon-folder);
            }
            .tree-item .caret {
                flex-shrink: 0;
                width: 16px;
                height: 16px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: transform 0.12s;
            }
            .tree-item .caret.open {
                transform: rotate(90deg);
            }
            .tree-item .caret.hidden {
                visibility: hidden;
            }
            .tree-item .label {
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .tree-children {
                padding-left: 12px;
            }
            .tree-children.collapsed {
                display: none;
            }

            /* ── Connection Banner ────────────────────────────────────── */
            #connection-banner {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 200;
                padding: 10px 16px;
                background: var(--rv-error-bg);
                border-bottom: 1px solid var(--rv-error-border);
                color: var(--rv-error-text);
                font-size: 14px;
                text-align: center;
                animation: slideDown 0.2s ease-out;
            }
            #connection-banner.show {
                display: block;
            }
            #connection-banner .banner-icon {
                margin-right: 8px;
            }
            #connection-banner .retry-btn {
                margin-left: 12px;
                padding: 4px 12px;
                font-size: 12px;
                background: var(--rv-error-text);
                color: #fff;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }
            #connection-banner .retry-btn:hover {
                background: var(--rv-error-btn-hover);
            }
            @keyframes slideDown {
                from {
                    transform: translateY(-100%);
                }
                to {
                    transform: translateY(0);
                }
            }

            /* ── Fuzzy Search Modal ───────────────────────────────────── */
            #search-overlay {
                display: none;
                position: fixed;
                inset: 0;
                z-index: 100;
                background: var(--rv-overlay);
                justify-content: center;
                padding-top: 80px;
            }
            #search-overlay.open {
                display: flex;
            }
            #search-box {
                width: 540px;
                max-width: 90vw;
                background: var(--rv-bg);
                border: 1px solid var(--rv-border);
                border-radius: 12px;
                box-shadow: 0 8px 24px var(--rv-shadow);
                overflow: hidden;
                align-self: flex-start;
            }
            #search-input {
                width: 100%;
                padding: 12px 16px;
                font-size: 16px;
                border: none;
                outline: none;
                border-bottom: 1px solid var(--rv-border);
                font-family: inherit;
                background: var(--rv-bg);
                color: var(--rv-text);
            }
            #search-input::placeholder {
                color: var(--rv-text-tertiary);
            }
            #search-results {
                max-height: 400px;
                overflow-y: auto;
            }
            .search-result {
                padding: 8px 16px;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 13px;
            }
            .search-result:hover,
            .search-result.selected {
                background: var(--rv-bg-active);
            }
            .search-result .sr-icon {
                flex-shrink: 0;
                color: var(--rv-text-secondary);
                width: 16px;
            }
            .search-result .sr-path {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .search-result mark {
                background: none;
                font-weight: 700;
                color: var(--rv-text);
            }
            #search-empty {
                padding: 16px;
                color: var(--rv-text-secondary);
                text-align: center;
                font-size: 13px;
            }

            /* ── Markdown body (GitHub-style) ─────────────────────────── */
            .markdown-body {
                font-size: 16px;
                line-height: 1.6;
                word-wrap: break-word;
                color: var(--rv-text);
            }
            .markdown-body h1,
            .markdown-body h2,
            .markdown-body h3,
            .markdown-body h4,
            .markdown-body h5,
            .markdown-body h6 {
                margin-top: 24px;
                margin-bottom: 16px;
                font-weight: 600;
                line-height: 1.25;
                position: relative;
            }
            .markdown-body .heading-anchor {
                color: var(--rv-text-secondary);
                opacity: 0;
                transition: opacity 0.1s;
                text-decoration: none;
                margin-left: 8px;
            }
            .markdown-body h1:hover .heading-anchor,
            .markdown-body h2:hover .heading-anchor,
            .markdown-body h3:hover .heading-anchor,
            .markdown-body h4:hover .heading-anchor,
            .markdown-body h5:hover .heading-anchor,
            .markdown-body h6:hover .heading-anchor,
            .markdown-body .heading-anchor:focus {
                opacity: 1;
            }
            .markdown-body .heading-anchor:hover {
                color: var(--rv-link);
            }
            .markdown-body h1 {
                font-size: 2em;
                padding-bottom: 0.3em;
                border-bottom: 1px solid var(--rv-border);
            }
            .markdown-body h2 {
                font-size: 1.5em;
                padding-bottom: 0.3em;
                border-bottom: 1px solid var(--rv-border);
            }
            .markdown-body h3 {
                font-size: 1.25em;
            }
            .markdown-body h4 {
                font-size: 1em;
            }
            .markdown-body h5 {
                font-size: 0.875em;
            }
            .markdown-body h6 {
                font-size: 0.85em;
                color: var(--rv-text-secondary);
            }
            .markdown-body p {
                margin-top: 0;
                margin-bottom: 16px;
            }
            .markdown-body ul,
            .markdown-body ol {
                padding-left: 2em;
                margin-bottom: 16px;
            }
            .markdown-body li + li {
                margin-top: 0.25em;
            }
            .markdown-body blockquote {
                margin: 0 0 16px;
                padding: 0 1em;
                color: var(--rv-text-secondary);
                border-left: 0.25em solid var(--rv-border);
            }
            .markdown-body code {
                padding: 0.2em 0.4em;
                font-size: 85%;
                background: var(--rv-bg-tertiary);
                border-radius: 6px;
                font-family:
                    ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                    monospace;
            }
            .markdown-body pre {
                margin-bottom: 16px;
                padding: 16px;
                overflow: auto;
                font-size: 85%;
                line-height: 1.45;
                background: var(--rv-bg-secondary);
                border-radius: 6px;
                border: 1px solid var(--rv-border);
            }
            .markdown-body pre code {
                padding: 0;
                background: transparent;
                border-radius: 0;
                font-size: 100%;
            }
            .markdown-body .mermaid {
                text-align: center;
                margin: 16px 0;
                padding: 16px;
                background: var(--rv-bg-secondary);
                border-radius: 6px;
                border: 1px solid var(--rv-border);
                overflow-x: auto;
            }
            .wiki-link {
                text-decoration: none;
                border-bottom: 1px dashed var(--rv-link);
                cursor: pointer;
            }
            .wiki-link:hover {
                border-bottom-style: solid;
            }
            .wiki-link-broken {
                color: var(--rv-error-text);
                border-bottom-color: var(--rv-error-text);
            }
            .wiki-link-broken::after {
                content: ' [?]';
                font-size: 0.8em;
            }
            .wiki-image {
                max-width: 100%;
            }
            .wiki-image-broken {
                opacity: 0.4;
                border: 1px dashed var(--rv-error-text);
            }
            .markdown-body table {
                border-collapse: collapse;
                border-spacing: 0;
                margin-bottom: 16px;
                width: auto;
                overflow: auto;
                display: block;
            }
            .markdown-body table th,
            .markdown-body table td {
                padding: 6px 13px;
                border: 1px solid var(--rv-border);
            }
            .markdown-body table th {
                font-weight: 600;
                background: var(--rv-bg-secondary);
            }
            .markdown-body table tr:nth-child(2n) {
                background: var(--rv-bg-secondary);
            }
            .markdown-body img {
                max-width: 100%;
            }
            .markdown-body hr {
                height: 0.25em;
                padding: 0;
                margin: 24px 0;
                background: var(--rv-border);
                border: 0;
            }
            .markdown-body a {
                color: var(--rv-link);
            }
            .markdown-body .task-list-item {
                list-style: none;
            }
            .markdown-body .task-list-item input {
                margin-right: 0.5em;
            }

            /* ── Collapsible heading sections ────────────────────────── */
            .markdown-body .heading-section { position: relative; }
            .markdown-body .heading-section-content {
                display: grid;
                grid-template-rows: 1fr;
                transition: grid-template-rows 0.2s ease-out;
            }
            .markdown-body .heading-section.collapsed > .heading-section-content {
                grid-template-rows: 0fr;
            }
            .markdown-body .heading-section-content > .heading-section-inner {
                min-height: 0;
                overflow: hidden;
                margin-left: -24px;
                padding-left: 24px;
            }
            .markdown-body .heading-toggle {
                position: absolute;
                left: -24px;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
                height: 20px;
                cursor: pointer;
                opacity: 0;
                transition: opacity 0.15s, transform 0.15s;
                background: none;
                border: none;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .markdown-body h1:hover .heading-toggle,
            .markdown-body h2:hover .heading-toggle,
            .markdown-body h3:hover .heading-toggle,
            .markdown-body h4:hover .heading-toggle,
            .markdown-body h5:hover .heading-toggle,
            .markdown-body h6:hover .heading-toggle,
            .markdown-body .heading-toggle:focus { opacity: 1; }
            .markdown-body .heading-section.collapsed > h1 .heading-toggle,
            .markdown-body .heading-section.collapsed > h2 .heading-toggle,
            .markdown-body .heading-section.collapsed > h3 .heading-toggle,
            .markdown-body .heading-section.collapsed > h4 .heading-toggle,
            .markdown-body .heading-section.collapsed > h5 .heading-toggle,
            .markdown-body .heading-section.collapsed > h6 .heading-toggle {
                transform: translateY(-50%) rotate(-90deg);
                opacity: 0.6;
            }

            /* ── Outline sidebar ──────────────────────────────────────── */
            #outline-sidebar {
                position: relative;
                width: 0;
                min-width: 0;
                overflow: hidden;
                background: var(--rv-bg);
                border-left: 1px solid transparent;
                transition:
                    width 0.15s ease,
                    min-width 0.15s ease,
                    border-color 0.15s ease;
                display: flex;
                flex-direction: column;
                flex-shrink: 0;
            }
            #outline-sidebar.open {
                width: 280px;
                min-width: 180px;
                border-left-color: var(--rv-border);
            }
            #outline-resize-handle {
                position: absolute;
                top: 45px;
                left: 0;
                width: 6px;
                bottom: 0;
                cursor: col-resize;
                z-index: 10;
            }
            #outline-resize-handle:hover,
            #outline-resize-handle.active {
                background: var(--rv-resize-handle);
            }
            .outline-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 16px;
                border-bottom: 1px solid var(--rv-border);
            }
            .outline-header-title {
                font-weight: 600;
                font-size: 14px;
                color: var(--rv-text);
            }
            .outline-close {
                background: none;
                border: none;
                padding: 4px;
                cursor: pointer;
                color: var(--rv-text-secondary);
                border-radius: 4px;
                display: flex;
            }
            .outline-close:hover {
                background: var(--rv-bg-hover);
                color: var(--rv-text);
            }
            .outline-content {
                flex: 1;
                overflow-y: auto;
                padding: 8px 0;
            }
            .outline-list {
                list-style: none;
                margin: 0;
                padding: 0;
            }
            .outline-link {
                display: block;
                padding: 6px 16px;
                color: var(--rv-text);
                text-decoration: none;
                font-size: 14px;
                line-height: 1.5;
            }
            .outline-link:hover {
                background: var(--rv-bg-secondary);
                color: var(--rv-link);
            }
            .outline-h1 {
                font-weight: 600;
            }
            .outline-h2 {
                padding-left: 32px;
            }
            .outline-h3 {
                padding-left: 48px;
                color: var(--rv-text-secondary);
            }
            .outline-h4 {
                padding-left: 64px;
                color: var(--rv-text-secondary);
            }
            .outline-h5 {
                padding-left: 80px;
                color: var(--rv-text-secondary);
            }
            .outline-h6 {
                padding-left: 96px;
                color: var(--rv-text-secondary);
            }
            .outline-empty {
                padding: 16px;
                color: var(--rv-text-secondary);
                font-size: 14px;
            }

            /* Outline toggle button */
            .outline-btn {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 5px 12px;
                font-size: 12px;
                font-weight: 500;
                color: var(--rv-text);
                background: var(--rv-bg-secondary);
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                cursor: pointer;
            }
            .outline-btn:hover {
                background: var(--rv-bg-hover);
            }
            .outline-btn.active {
                background: var(--rv-bg-active);
                border-color: var(--rv-border-active);
                color: var(--rv-link);
            }
            .outline-btn svg {
                color: var(--rv-text-secondary);
            }
            .outline-btn.active svg {
                color: var(--rv-link);
            }

            /* ── Source code (non-markdown) ───────────────────────────── */
            .source-code {
                font-family:
                    ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                    monospace;
                font-size: 13px;
                line-height: 1.5;
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                overflow: auto;
                background: var(--rv-bg);
                color: var(--rv-text);
            }
            .source-code pre {
                margin: 0;
                padding: 16px;
            }

            /* Chroma syntax highlighting uses class-based output so code
               tokens follow the active theme instead of light-mode inline
               styles. Token classes come from the chroma HTML formatter. */
            .source-code pre.chroma {
                background: none;
                color: var(--rv-text);
            }
            .source-code .lnt,
            .source-code .lntd,
            .source-code .lntable {
                color: var(--rv-text-tertiary);
                border: 0;
            }
            .source-code .k,
            .source-code .kc,
            .source-code .kd,
            .source-code .kn,
            .source-code .kp,
            .source-code .kr,
            .source-code .kt {
                color: var(--rv-code-key);
            }
            .source-code .c,
            .source-code .ch,
            .source-code .cm,
            .source-code .c1,
            .source-code .cp,
            .source-code .cs {
                color: var(--rv-code-com);
                font-style: italic;
            }
            .source-code .s,
            .source-code .sb,
            .source-code .sc,
            .source-code .sd,
            .source-code .se,
            .source-code .sh,
            .source-code .si,
            .source-code .sr,
            .source-code .s1,
            .source-code .ss,
            .source-code .sa,
            .source-code .sx {
                color: var(--rv-code-str);
            }
            .source-code .m,
            .source-code .mb,
            .source-code .mf,
            .source-code .mh,
            .source-code .mi,
            .source-code .mo,
            .source-code .il {
                color: var(--rv-code-num);
            }
            .source-code .nf,
            .source-code .fm {
                color: var(--rv-code-fn);
            }
            .source-code .nc,
            .source-code .no,
            .source-code .nb,
            .source-code .nx {
                color: var(--rv-code-cls);
            }
            .source-code .na,
            .source-code .nt,
            .source-code .nd {
                color: var(--rv-code-tag);
            }
            .source-code .nv {
                color: var(--rv-code-attr);
            }
            .source-code .o,
            .source-code .ow,
            .source-code .p {
                color: var(--rv-code-op);
            }
            .source-code .err {
                color: var(--rv-error-text);
            }

            /* ── Plain text reading view (.txt) ──────────────────────── */
            .source-code pre.plain-text {
                font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo,
                    Consolas, monospace;
                line-height: 1.6;
                background: var(--rv-bg-secondary);
                color: var(--rv-text);
            }
            .plain-text .plain-line {
                display: block;
                min-height: 1.6em;
            }
            .plain-text.wrap-on .plain-line {
                white-space: pre-wrap;
                overflow-wrap: anywhere;
            }
            .plain-text:not(.wrap-on) .plain-line {
                white-space: pre;
            }
            .plain-text.show-numbers {
                counter-reset: plain-line;
            }
            .plain-text.show-numbers .plain-line {
                counter-increment: plain-line;
            }
            .plain-text.show-numbers .plain-line::before {
                content: counter(plain-line);
                display: inline-block;
                width: 3em;
                margin-right: 1.25em;
                text-align: right;
                color: var(--rv-text-secondary);
                opacity: 0.55;
                user-select: none;
            }

            /* ── CSV table ────────────────────────────────────────────── */
            .csv-view {
                margin-bottom: 16px;
            }
            .csv-filter-bar {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-wrap: wrap;
                padding: 8px 10px;
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                background: var(--rv-bg-secondary);
                margin-bottom: 8px;
            }
            .csv-filter-bar select,
            .csv-filter-bar input {
                padding: 4px 8px;
                font-size: 12px;
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                background: var(--rv-bg);
                color: var(--rv-text);
                font-family: inherit;
            }
            .csv-filter-value {
                width: 140px;
            }
            .csv-filter-add {
                padding: 4px 10px;
                font-size: 12px;
                font-weight: 500;
                color: #ffffff;
                background: var(--rv-btn-bg);
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-family: inherit;
            }
            .csv-filter-add:hover {
                opacity: 0.9;
            }
            .csv-filter-clear {
                padding: 4px 10px;
                font-size: 12px;
                color: var(--rv-text);
                background: var(--rv-bg);
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                cursor: pointer;
                font-family: inherit;
            }
            .csv-filter-clear:hover {
                background: var(--rv-bg-hover);
            }
            .csv-filter-count {
                margin-left: auto;
                font-size: 12px;
                color: var(--rv-text-secondary);
                font-variant-numeric: tabular-nums;
            }
            .csv-filter-invalid {
                font-size: 12px;
                color: var(--rv-error-text);
            }
            .csv-filter-chips {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-wrap: wrap;
                margin-bottom: 8px;
            }
            .csv-filter-chip {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 3px 10px;
                font-size: 12px;
                color: var(--rv-text);
                background: var(--rv-bg);
                border: 1px solid var(--rv-border);
                border-radius: 999px;
                cursor: pointer;
                font-family: inherit;
            }
            .csv-filter-chip strong {
                font-weight: 600;
                color: var(--rv-text-secondary);
            }
            .csv-filter-chip code {
                font-size: 11px;
                background: var(--rv-bg-secondary);
                padding: 1px 6px;
                border-radius: 4px;
            }
            .csv-filter-chip-x {
                color: var(--rv-text-secondary);
                font-size: 11px;
            }
            .csv-filter-chip:hover .csv-filter-chip-x {
                color: var(--rv-error-text);
            }
            .csv-filter-modes {
                display: inline-flex;
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                overflow: hidden;
                margin-left: 4px;
            }
            .csv-filter-mode {
                padding: 3px 10px;
                font-size: 12px;
                color: var(--rv-text);
                background: var(--rv-bg);
                border: none;
                cursor: pointer;
                font-family: inherit;
            }
            .csv-filter-mode.active {
                background: var(--rv-bg-hover);
                font-weight: 600;
                color: var(--rv-text);
            }

            /* ── XML viewer (Tree/Table/Code) ────────────────────────── */
            .xml-view {
                margin-bottom: 16px;
            }
            .xml-table-wrap {
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                overflow: auto;
            }
            .xml-table {
                border-collapse: collapse;
                width: 100%;
            }
            .xml-table th,
            .xml-table td {
                padding: 6px 13px;
                border: 1px solid var(--rv-border);
                font-size: 13px;
                text-align: left;
            }
            .xml-table th {
                background: var(--rv-bg-secondary);
                font-weight: 600;
            }
            .xml-tree {
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                background: var(--rv-bg);
                padding: 8px 12px;
                font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo,
                    Consolas, monospace;
                font-size: 13px;
            }
            .xml-tree ul,
            .xml-children {
                list-style: none;
                margin: 2px 0 2px;
                padding-left: 18px;
                border-left: 1px dotted var(--rv-border);
            }
            .xml-node {
                margin: 2px 0;
            }
            .xml-node-line {
                padding: 2px 4px;
                border-radius: 4px;
            }
            .xml-node-line:hover {
                background: var(--rv-bg-hover);
            }
            .xml-attr {
                color: var(--rv-link);
                margin-right: 6px;
            }
            .xml-text {
                color: var(--rv-text-secondary);
                margin-left: 6px;
            }
            .xml-tree-empty {
                opacity: 0.8;
            }
            .csv-table {
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                overflow: auto;
            }
            .csv-chart-view {
                margin-bottom: 16px;
            }
            .csv-chart-bar .csv-chart-note {
                margin-left: auto;
                font-size: 12px;
                color: var(--rv-text-secondary);
                font-variant-numeric: tabular-nums;
            }
            .csv-chart-box {
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                background: var(--rv-bg);
                padding: 8px;
                overflow: hidden;
            }
            svg.csv-chart {
                display: block;
                width: 100%;
                height: auto;
                max-height: 480px;
            }
            .chart-tick,
            .chart-label {
                font-size: 11px;
                fill: var(--rv-text-secondary);
                font-family:
                    ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                    monospace;
            }
            .chart-center {
                font-size: 20px;
                font-weight: 600;
                fill: var(--rv-text);
            }
            .chart-rect,
            .chart-slice,
            .chart-dot {
                opacity: 0.92;
            }
            .chart-rect:hover,
            .chart-slice:hover,
            .chart-dot:hover {
                opacity: 1;
                filter: brightness(1.08);
            }
            .chart-legend {
                display: flex;
                align-items: center;
                gap: 14px;
                flex-wrap: wrap;
                padding: 4px 2px 8px;
            }
            .chart-legend:empty {
                display: none;
            }
            .chart-legend-item {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                font-size: 12px;
                color: var(--rv-text-secondary);
            }
            .chart-legend-item i {
                width: 10px;
                height: 10px;
                border-radius: 3px;
                display: inline-block;
            }
            .csv-chart-empty {
                padding: 48px 16px;
                text-align: center;
                color: var(--rv-text-secondary);
                font-size: 13px;
            }
            .csv-table table {
                border-collapse: collapse;
                width: 100%;
            }
            .csv-table th,
            .csv-table td {
                padding: 6px 13px;
                border: 1px solid var(--rv-border);
                font-size: 13px;
            }
            .csv-table th {
                background: var(--rv-bg-secondary);
                font-weight: 600;
                position: sticky;
                top: 0;
            }

            /* ── CSV records view ─────────────────────────────────────── */
            .csv-records {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }
            .csv-record-card {
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                overflow: hidden;
            }
            .csv-record-card .record-header {
                background: var(--rv-bg-secondary);
                padding: 8px 13px;
                font-weight: 600;
                border-bottom: 1px solid var(--rv-border);
            }
            .csv-record-card .field-row {
                display: flex;
                border-top: 1px solid var(--rv-border);
            }
            .csv-record-card .field-row:first-child {
                border-top: none;
            }
            .csv-record-card .field-label {
                width: 30%;
                min-width: 120px;
                padding: 6px 13px;
                background: var(--rv-bg-secondary);
                font-weight: 500;
                font-size: 13px;
                border-right: 1px solid var(--rv-border);
            }
            .csv-record-card .field-value {
                flex: 1;
                padding: 6px 13px;
                font-size: 13px;
                word-break: break-word;
            }

            /* ── CSV row-to-record link ──────────────────────────────── */
            .csv-row-link-header {
                width: 40px;
            }
            .csv-row-link {
                width: 40px;
                text-align: center;
            }
            .csv-record-link-btn {
                background: none;
                border: none;
                cursor: pointer;
                color: var(--rv-link);
                font-size: 14px;
                padding: 4px 8px;
                border-radius: 4px;
            }
            .csv-record-link-btn:hover {
                background: var(--rv-bg-secondary);
            }

            /* ── JSONL viewer ────────────────────────────────────────── */
            .jsonl-container {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .jsonl-record-card {
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                overflow: hidden;
                background: var(--rv-bg);
            }

            .jsonl-record-header {
                background: var(--rv-bg-secondary);
                padding: 6px 13px;
                font-weight: 600;
                font-size: 12px;
                color: var(--rv-text-secondary);
                border-bottom: 1px solid var(--rv-border);
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .jsonl-record-number {
                font-family: ui-monospace, monospace;
            }

            .jsonl-record-content {
                font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo,
                    Consolas, monospace;
                font-size: 13px;
                line-height: 1.5;
            }

            .jsonl-record-content pre {
                margin: 0;
                padding: 12px;
                overflow-x: auto;
            }

            .jsonl-record-error {
                background: var(--rv-warning-bg);
                border-left: 3px solid var(--rv-warning-border);
                padding: 8px 13px;
                font-size: 12px;
                color: var(--rv-warning-text);
                font-family: ui-monospace, monospace;
            }

            /* Pagination controls */
            .jsonl-pagination {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 12px;
                padding: 16px;
                border-top: 1px solid var(--rv-border);
                background: var(--rv-bg-secondary);
            }

            .jsonl-pagination button {
                padding: 6px 12px;
                font-size: 13px;
                font-weight: 500;
                color: var(--rv-text);
                background: var(--rv-bg);
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                cursor: pointer;
            }

            .jsonl-pagination button:hover:not(:disabled) {
                background: var(--rv-bg-secondary);
                border-color: var(--rv-text);
            }

            .jsonl-pagination button:disabled {
                color: var(--rv-text-tertiary);
                cursor: not-allowed;
                opacity: 0.6;
            }

            .jsonl-pagination-info {
                font-size: 13px;
                color: var(--rv-text-secondary);
                margin: 0 8px;
            }

            .jsonl-pagination-jump {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .jsonl-pagination-jump input {
                width: 60px;
                padding: 5px 8px;
                font-size: 13px;
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                text-align: center;
                background: var(--rv-bg);
                color: var(--rv-text);
            }

            .jsonl-loading {
                text-align: center;
                padding: 48px;
                color: var(--rv-text-secondary);
                font-size: 14px;
            }

            /* Compact view */
            .jsonl-compact-table {
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                overflow: auto;
            }

            .jsonl-compact-table table {
                border-collapse: collapse;
                width: 100%;
            }

            .jsonl-compact-table th,
            .jsonl-compact-table td {
                padding: 6px 13px;
                border: 1px solid var(--rv-border);
                font-size: 13px;
                font-family: ui-monospace, monospace;
            }

            .jsonl-compact-table th {
                background: var(--rv-bg-secondary);
                font-weight: 600;
                position: sticky;
                top: 0;
            }

            .jsonl-compact-table .jsonl-actions-cell {
                white-space: nowrap;
            }

            .jsonl-compact-table .jsonl-action-btn {
                background: none;
                border: none;
                cursor: pointer;
                color: var(--rv-link);
                font-size: 12px;
                padding: 2px 6px;
                border-radius: 4px;
                margin-right: 4px;
            }

            .jsonl-compact-table .jsonl-action-btn:hover {
                background: var(--rv-bg-secondary);
                text-decoration: underline;
            }

            .jsonl-compact-expanded {
                display: none;
            }

            .jsonl-compact-expanded.visible {
                display: table-row;
            }

            .jsonl-compact-expanded td {
                background: var(--rv-bg-secondary);
                padding: 12px;
            }

            .jsonl-compact-expanded pre {
                margin: 0;
                padding: 12px;
                background: var(--rv-bg);
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                overflow-x: auto;
            }

            /* Raw view */
            .jsonl-raw {
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                background: var(--rv-bg-secondary);
            }

            .jsonl-raw pre {
                margin: 0;
                padding: 16px;
                font-family: ui-monospace, monospace;
                font-size: 13px;
                line-height: 1.5;
                overflow-x: auto;
            }

            /* Page size selector */
            .jsonl-page-size {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 12px;
                color: var(--rv-text-secondary);
            }

            .jsonl-page-size select {
                padding: 4px 8px;
                font-size: 12px;
                border: 1px solid var(--rv-border);
                border-radius: 6px;
                background: var(--rv-bg);
                color: var(--rv-text);
            }

            /* ── File header bar (GitHub-style) ──────────────────────── */
            #file-header-bar {
                display: none;
                padding: 8px 16px;
                background: var(--rv-bg-secondary);
                border-bottom: 1px solid var(--rv-border);
                align-items: center;
                gap: 16px;
                flex-shrink: 0;
            }
            #file-header-bar.visible {
                display: flex;
            }
            #file-header-bar .file-header-left {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            #file-header-bar .file-header-meta {
                color: var(--rv-text-secondary);
                font-size: 12px;
                display: flex;
                align-items: center;
                gap: 4px;
            }
            #file-header-bar .file-header-meta .sep {
                margin: 0 4px;
            }
            #file-header-bar .file-header-actions {
                margin-left: auto;
                display: flex;
                align-items: center;

            /* ── Theme Toggle ─────────────────────────────────────────── */

        </style>

        <script>
            /* ── Theme toggle ─────────────────────────────────────────── */
            var THEMES = [
                { id: 'light', label: 'Light',
                  swatch: ['#ffffff', '#705dcf'] },
                { id: 'dark', label: 'Dark',
                  swatch: ['#1e1e2e', '#89b4fa'] },
                { id: 'nord', label: 'Nord',
                  swatch: ['#2e3440', '#88c0d0'] },
                { id: 'opencode', label: 'OpenCode Orng',
                  swatch: ['#0a0a0a', '#ec5b2b'] },
            ];
            var themeMenu = document.getElementById('theme-menu');
            var themeBtn = document.getElementById('theme-toggle');

            function isDarkTheme(theme) {
                return theme !== 'light';
            }

            function currentTheme() {
                var t = document.documentElement.getAttribute('data-theme');
                for (var i = 0; i < THEMES.length; i++) {
                    if (THEMES[i].id === t) return t;
                }
                return 'light';
            }

            function setTheme(theme) {
                for (var i = 0; i < THEMES.length; i++) {
                    if (THEMES[i].id !== theme) continue;
                    document.documentElement.setAttribute('data-theme', theme);
                    localStorage.setItem('rv-theme', theme);
                    themeBtn.setAttribute('title', 'Theme: ' + THEMES[i].label);
                    updateMermaidTheme(theme);
                    renderThemeMenu();
                    return;
                }
            }

            function renderThemeMenu() {
                themeMenu.innerHTML = '';
                var active = currentTheme();
                THEMES.forEach(function (t) {
                    var btn = document.createElement('button');
                    btn.className = 'theme-menu-item';
                    btn.setAttribute('role', 'menuitemradio');
                    btn.setAttribute('aria-checked', String(t.id === active));
                    var swatch = document.createElement('span');
                    swatch.className = 'theme-swatch';
                    swatch.innerHTML =
                        '<i style="background:' + t.swatch[0] + '"></i>' +
                        '<i style="background:' + t.swatch[1] + '"></i>';
                    btn.appendChild(swatch);
                    btn.appendChild(document.createTextNode(t.label));
                    if (t.id === active) {
                        var mark = document.createElement('span');
                        mark.className = 'theme-mark';
                        mark.textContent = '✓';
                        btn.appendChild(mark);
                    }
                    btn.onclick = function () {
                        closeThemeMenu();
                        setTheme(t.id);
                    };
                    themeMenu.appendChild(btn);
                });
            }

            function openThemeMenu() {
                renderThemeMenu();
                themeMenu.hidden = false;
                themeBtn.setAttribute('aria-expanded', 'true');
            }

            function closeThemeMenu() {
                themeMenu.hidden = true;
                themeBtn.setAttribute('aria-expanded', 'false');
            }

            themeBtn.onclick = function (e) {
                e.stopPropagation();
                if (themeMenu.hidden) openThemeMenu();
                else closeThemeMenu();
            };
            document.addEventListener('click', function (e) {
                if (
                    !themeMenu.hidden &&
                    !themeMenu.contains(e.target) &&
                    !themeBtn.contains(e.target)
                ) {
                    closeThemeMenu();
                }
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && !themeMenu.hidden) closeThemeMenu();
            });

            function updateMermaidTheme(theme) {
                mermaid.initialize({
                    startOnLoad: false,
                    theme: theme === 'light' ? 'default' : 'dark'
                });
                var diagrams = document.querySelectorAll('.mermaid[data-processed="true"]');
                diagrams.forEach(function(el) {
                    var original = el.getAttribute('data-original');
                    if (original) {
                        el.removeAttribute('data-processed');
                        el.innerHTML = original;
                    }
                });
                if (diagrams.length > 0) {
                    mermaid.run();
                }
            }

            (function() {
                var t = THEMES.find(function (x) {
                    return x.id === currentTheme();
                });
                themeBtn.setAttribute('title', 'Theme: ' + (t ? t.label : 'Light'));
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                    if (!localStorage.getItem('rv-theme')) {
                        var theme = e.matches ? 'dark' : 'light';
                        document.documentElement.setAttribute('data-theme', theme);
                        updateMermaidTheme(theme);
                        themeBtn.setAttribute(
                            'title',
                            'Theme: ' + (theme === 'dark' ? 'Dark' : 'Light'),
                        );
                    }
                });
            })();

            var rootDirName = __ROOT_DIR_NAME_JS__;
            /* ── SVG helpers ──────────────────────────────────────────── */
            const SVG = {
                folderClosed:

            function getFileIcon(name) {
                const ext = name.split('.').pop().toLowerCase();
                if (ext === 'md' || ext === 'mdx' || ext === 'markdown') return SVG.fileMarkdown;
                if (ext === 'pdf') return SVG.filePdf;
                if (ext === 'json') return SVG.fileJson;
                if (ext === 'yml' || ext === 'yaml') return SVG.fileYaml;
                return SVG.file;
            }

            let currentFilePath = "";

            let ws = null;

            var preferredEditor = localStorage.getItem("preferredEditor");

            /* ── Connection Status ───────────────────────────────────── */
            function showConnectionError(message) {
                connectionLost = true;
                var banner = document.getElementById("connection-banner");
                banner.querySelector(".banner-message").textContent =
                    message || "Connection lost. The server may have stopped.";
                banner.classList.add("show");
            }

            function hideConnectionError() {
                connectionLost = false;
                document
                    .getElementById("connection-banner")
                    .classList.remove("show");
            }

            async function retryConnection() {
                try {
                    var res = await fetch("/api/tree?path=.");
                    if (res.ok) {
                        hideConnectionError();
                        treeCache = {};
                        allFiles = null;
                        wikiLinkIndex = null;
                        await refreshTree();
                        connectWS();
                    }
                } catch (e) {
                    // Still disconnected
                }
            }

            /* ── API helpers ──────────────────────────────────────────── */
            // Returns {ok, data, status, error} - distinguishes network vs HTTP errors
            async function apiFetch(url) {
                try {
                    var res = await fetch(url);
                    hideConnectionError();
                    if (!res.ok) {
                        var errorText = await res.text().catch(function () {
                            return res.statusText;
                        });
                        return {
                            ok: false,
                            status: res.status,
                            error: errorText,
                        };
                    }
                    var data = await res.json();
                    return { ok: true, data: data };
                } catch (e) {
                    // Network error - server unreachable
                    showConnectionError();
                    return {
                        ok: false,
                        status: 0,
                        error: "network",
                        isNetworkError: true,
                    };
                }
            }

            async function loadEditors() {
                var result = await apiFetch("/api/editors");
                if (result.ok) {
                    availableEditors = result.data || [];
                }
            }

            function createEditButton() {
                var container = document.createElement("div");
                container.className = "edit-dropdown";

                var btn = document.createElement("button");
                btn.className = "edit-dropdown-btn";
                btn.innerHTML =
                    '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61Zm.176 4.823L9.75 4.81l-6.286 6.287a.253.253 0 0 0-.064.108l-.558 1.953 1.953-.558a.253.253 0 0 0 .108-.064Zm1.238-3.763a.25.25 0 0 0-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 0 0 0-.354Z"/></svg>Edit';

                var menu = document.createElement("div");
                menu.className = "edit-dropdown-menu";

                btn.onclick = function (e) {
                    e.stopPropagation();
                    // Close any other open dropdowns
                    document
                        .querySelectorAll(".edit-dropdown-menu.open")
                        .forEach(function (m) {
                            if (m !== menu) m.classList.remove("open");
                        });
                    menu.classList.toggle("open");
                    if (menu.classList.contains("open")) {
                        populateEditMenu(menu);
                    }
                };

                container.appendChild(btn);
                container.appendChild(menu);

                // Close on outside click
                document.addEventListener("click", function (e) {
                    if (!container.contains(e.target)) {
                        menu.classList.remove("open");
                    }
                });

                return container;
            }

            function populateEditMenu(menu) {
                menu.innerHTML = "";

                // Filter editors into installed and not installed
                var installed = availableEditors.filter(function (e) {
                    return e.available;
                });
                var notInstalled = availableEditors.filter(function (e) {
                    return !e.available;
                });

                if (installed.length === 0) {
                    menu.innerHTML =
                        '<div class="edit-dropdown-empty">No editors found</div>';
                } else {
                    // Add header
                    var header = document.createElement("div");
                    header.className = "edit-dropdown-header";
                    header.textContent = "Installed editors";
                    menu.appendChild(header);

                    // Sort: preferred first, then alphabetically
                    var sorted = installed.slice().sort(function (a, b) {
                        if (a.id === preferredEditor) return -1;
                        if (b.id === preferredEditor) return 1;
                        return a.name.localeCompare(b.name);
                    });

                    sorted.forEach(function (editor) {
                        var item = document.createElement("button");
                        item.className = "edit-dropdown-item";
                        if (editor.id === preferredEditor) {
                            item.classList.add("preferred");
                        }
                        var icon = editorIcons[editor.id] || "";
                        item.innerHTML =
                            icon + "<span>" + esc(editor.name) + "</span>";
                        item.onclick = function (e) {
                            e.stopPropagation();
                            menu.classList.remove("open");
                            openInEditor(editor.id);
                        };
                        menu.appendChild(item);
                    });
                }

                // Show footer with uninstalled editors as links
                if (notInstalled.length > 0) {
                    notInstalled.sort(function (a, b) {
                        return a.name.localeCompare(b.name);
                    });
                    var links = notInstalled.map(function (e) {
                        return (
                            '<a href="' +
                            escAttr(e.setupUrl) +
                            '" target="_blank">' +
                            esc(e.name) +
                            "</a>"
                        );
                    });
                    var footer = document.createElement("div");
                    footer.className = "edit-dropdown-footer";
                    footer.innerHTML =
                        "Also supports: " +
                        links.join(", ") +
                        ".<br>Requires shell command installation.";
                    menu.appendChild(footer);
                }
            }

                        e.stopPropagation();

            async function openInEditor(editorId) {
                // Save preference
                preferredEditor = editorId;
                localStorage.setItem("preferredEditor", editorId);

                var res = await fetch(
                    "/api/open?path=" +
                        encodeURIComponent(currentFilePath) +
                        "&editor=" +
                        encodeURIComponent(editorId),
                    {
                        method: "POST",
                    },
                );
                var data = await res.json();
                if (!data.success) {
                    showEditorError(data.error, data.setupUrl);
                }
            }

            function showEditorError(message, setupUrl) {
                // Remove existing toast
                var existing = document.querySelector(".editor-toast");
                if (existing) existing.remove();

                var toast = document.createElement("div");
                toast.className = "editor-toast";
                var linkHtml = setupUrl
                    ? ' <a class="editor-toast-link" href="' +
                      escAttr(setupUrl) +
                      '" target="_blank">Learn how →</a>'
                    : "";
                toast.innerHTML =
                    '<div class="editor-toast-content">' +
                    '<svg class="editor-toast-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2.343 13.657A8 8 0 1 1 13.658 2.343 8 8 0 0 1 2.343 13.657ZM6.03 4.97a.751.751 0 0 0-1.042.018.751.751 0 0 0-.018 1.042L6.94 8 4.97 9.97a.749.749 0 0 0 .326 1.275.749.749 0 0 0 .734-.215L8 9.06l1.97 1.97a.749.749 0 0 0 1.275-.326.749.749 0 0 0-.215-.734L9.06 8l1.97-1.97a.749.749 0 0 0-.326-1.275.749.749 0 0 0-.734.215L8 6.94Z"/></svg>' +
                    '<span class="editor-toast-message">' +
                    esc(message) +
