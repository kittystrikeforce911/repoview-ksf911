                    if (el.nodeType !== 1) return;
                    var tag = el.nodeName;
                    var path = (parentPath ? parentPath + "." : "") + tag;
                    var attrs = [];
                    for (var i = 0; i < el.attributes.length; i++) {
                        attrs.push({
                            name: el.attributes[i].name,
                            value: el.attributes[i].value,
                        });
                    }
                    var text = "";
                    for (var j = 0; j < el.childNodes.length; j++) {
                        if (el.childNodes[j].nodeType === 3) {
                            text += el.childNodes[j].nodeValue;
                        }
                    }
                    out.push({
                        el: el,
                        tag: tag,
                        path: path,
                        index: out.length,
                        attrs: attrs,
                        text: text.replace(/\s+/g, " ").trim(),
                    });
                    for (var k = 0; k < el.children.length; k++) {
                        walk(el.children[k], path);
                    }
                }
                if (doc && doc.documentElement) {
                    walk(doc.documentElement, "");
                }
                return out;
            }

            function xmlMatches(entry, filters, xpathSet) {
                if (filters.tag) {
                    try {
                        if (!xmlGlobToRegExp(filters.tag).test(entry.tag)) return false;
                    } catch (e) {
                        return false;
                    }
                }
                if (filters.attr) {
                    // Syntax: attr=substring, or tag@attr=substring with an
                    // optional tag glob.
                    var parts = filters.attr.split("@");
                    var tagPart = parts.length === 2 ? parts[0] : "";
                    var attrSpec = parts[parts.length - 1];
                    var eqIdx = attrSpec.indexOf("=");
                    var attrName = (eqIdx >= 0 ? attrSpec.slice(0, eqIdx) : attrSpec).trim().toLowerCase();
                    var attrValue = eqIdx >= 0 ? attrSpec.slice(eqIdx + 1).trim().toLowerCase() : null;
                    if (tagPart) {
                        try {
                            if (!xmlGlobToRegExp(tagPart).test(entry.tag)) return false;
                        } catch (e) {
                            return false;
                        }
                    }
                    var hit = false;
                    for (var i = 0; i < entry.attrs.length; i++) {
                        var a = entry.attrs[i];
                        if (a.name.toLowerCase() === attrName) {
                            hit =
                                attrValue == null ||
                                a.value.toLowerCase().indexOf(attrValue) !== -1;
                            break;
                        }
                    }
                    if (!hit) return false;
                }
                if (
                    filters.text &&
                    entry.text.toLowerCase().indexOf(filters.text.toLowerCase()) === -1
                ) {
                    return false;
                }
                if (xpathSet && !xpathSet.has(entry.el)) return false;
                return true;
            }

            async function renderXMLViewer(path, data) {
                var area = document.getElementById("content-area");
                if (getViewParam() === "tree") setViewParam(null);
                currentFileIsText = true;

                var doc = null;
                try {
                    doc = new DOMParser().parseFromString(data.rawXML || "", "text/xml");
                } catch (e) {
                    doc = null;
                }
                var parseError = doc && doc.querySelector("parsererror");
                var elements = parseError ? [] : xmlElementList(doc);

                var filters = { tag: "", attr: "", text: "", xpath: "" };
                var xpathSet = null;

                // ── Filter bar ──
                var bar = document.createElement("div");
                bar.className = "csv-filter-bar";
                function xmlInput(cls, placeholder) {
                    var input = document.createElement("input");
                    input.className = cls;
                    input.placeholder = placeholder;
                    input.type = "text";
                    return input;
                }
                var tagInput = xmlInput("csv-filter-col", "tag (glob: book*, b?ok)");
                var attrInput = xmlInput("csv-filter-op", "attr: name=value or tag@name=value");
                var textInput = xmlInput("csv-filter-value", "text contains…");
                var xpathInput = xmlInput("csv-filter-xpath", "XPath: //book[@genre='web']");
                var invalidMsg = document.createElement("span");
                invalidMsg.className = "csv-filter-invalid";
                var clearBtn = document.createElement("button");
                clearBtn.className = "csv-filter-clear";
                clearBtn.textContent = "Clear";
                var countEl = document.createElement("span");
                countEl.className = "csv-filter-count";
                bar.appendChild(tagInput);
                bar.appendChild(attrInput);
                bar.appendChild(textInput);
                bar.appendChild(xpathInput);
                bar.appendChild(invalidMsg);
                bar.appendChild(clearBtn);
                bar.appendChild(countEl);
                tagInput.style.flex = "1 1 150px";
                attrInput.style.flex = "1 1 190px";
                textInput.style.flex = "1 1 130px";
                xpathInput.style.flex = "1 1 190px";

                clearBtn.onclick = function () {
                    tagInput.value = "";
                    attrInput.value = "";
                    textInput.value = "";
                    xpathInput.value = "";
                    invalidMsg.textContent = "";
                    counts();
                };
                [tagInput, attrInput, textInput, xpathInput].forEach(function (input) {
                    input.addEventListener("keydown", function (e) {
                        if (e.key === "Enter") {
                            e.preventDefault();
                            counts();
                        }
                    });
                    input.addEventListener("input", counts);
                    input.addEventListener("change", counts);
                });

                function matchedEntries() {
                    filters.tag = tagInput.value.trim();
                    filters.attr = attrInput.value.trim();
                    filters.text = textInput.value.trim();
                    filters.xpath = xpathInput.value.trim();
                    invalidMsg.textContent = "";
                    try {
                        if (filters.tag) xmlGlobToRegExp(filters.tag);
                    } catch (e) {
                        invalidMsg.textContent = "invalid tag pattern";
                        return [];
                    }
                    xpathSet = null;
                    if (filters.xpath) {
                        try {
                            var snapshot = doc.evaluate(
                                filters.xpath,
                                doc,
                                null,
                                XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,
                                null,
                            );
                            xpathSet = new Set();
                            for (var xi = 0; xi < snapshot.snapshotLength; xi++) {
                                xpathSet.add(snapshot.snapshotItem(xi));
                            }
                        } catch (e) {
                            invalidMsg.textContent = "invalid xpath";
                            return [];
                        }
                    }
                    var matches = [];
                    for (var i = 0; i < elements.length; i++) {
                        if (xmlMatches(elements[i], filters, xpathSet)) {
                            matches.push(elements[i]);
                        }
                    }
                    return matches;
                }

                var xmlMain = document.createElement("div");
                xmlMain.className = "xml-view";
                var viewWrap = document.createElement("div");
                xmlMain.appendChild(bar);
                xmlMain.appendChild(viewWrap);
                area.innerHTML = "";
                area.appendChild(xmlMain);

                function renderXMLTableHTML(matches) {
                    var html =
                        '<table class="xml-table"><thead><tr><th>Path</th><th>Tag</th><th>Attributes</th><th>Text</th></tr></thead><tbody>';
                    for (var i = 0; i < matches.length; i++) {
                        var e = matches[i];
                        var attrHTML = "";
                        for (var j = 0; j < e.attrs.length; j++) {
                            attrHTML += (j ? " " : "") + esc(e.attrs[j].name) + '="' + esc(e.attrs[j].value) + '"';
                        }
                        html += "<tr><td>" + esc(e.path) + "</td><td>" + esc(e.tag) + "</td><td>" + attrHTML + "</td><td>" + esc(e.text) + "</td></tr>";
                    }
                    html += "</tbody></table>";
                    return html;
                }

                function treeHTML(matches) {
                    var matched = new Set();
                    matches.forEach(function (m) {
                        matched.add(m.el);
                    });
                    function visible(el) {
                        if (matched.has(el)) return true;
                        for (var i = 0; i < el.children.length; i++) {
                            if (visible(el.children[i])) return true;
                        }
                        return false;
                    }
                    function nodeHTML(el) {
                        var html = '<li class="xml-node"><div class="xml-node-line">';
                        for (var i = 0; i < el.attributes.length; i++) {
                            var a = el.attributes[i];
                            html += ' <span class="xml-attr">' + esc(a.name) + '="' + esc(a.value) + '"</span>';
                        }
                        var directText = "";
                        for (var j = 0; j < el.childNodes.length; j++) {
                            if (el.childNodes[j].nodeType === 3) {
                                directText += el.childNodes[j].nodeValue;
                            }
                        }
                        directText = directText.replace(/\s+/g, " ").trim();
                        if (directText) {
                            html += '<span class="xml-text">' + esc(directText) + "</span>";
                        }
                        html += "</div>";
                        var kids = el.children;
                        if (kids.length > 0 && visible(el)) {
                            // Always wrap so ancestors of matches keep the
                            // tree indentation; only visible children enter.
                            html += '<ul class="xml-children">';
                            for (var k = 0; k < kids.length; k++) {
                                if (visible(kids[k])) {
                                    html += nodeHTML(kids[k]);
                                }
                            }
                            html += "</ul>";
                        }
                        html += "</li>";
                        return html;
                    }
                    if (!doc || !doc.documentElement) {
                        return '<div class="xml-tree-empty">No XML document</div>';
                    }
                    if (!visible(doc.documentElement)) {
                        return '<div class="xml-tree-empty">No matching elements</div>';
                    }
                    return '<div class="xml-tree">' + nodeHTML(doc.documentElement) + "</div>";
                }

                function counts() {
                    var matches = matchedEntries();
                    var anyFilter =
                        filters.tag || filters.attr || filters.text || filters.xpath;
                    if (anyFilter) {
                        countEl.textContent =
                            "Showing " + matches.length + " of " + elements.length + " elements";
                        countEl.style.display = "";
                    } else {
                        countEl.style.display = "none";
                    }
                    var wantView = getViewParam();
                    if (wantView === "table") {
                        viewWrap.innerHTML =
                            '<div class="csv-table xml-table-wrap">' +
                            renderXMLTableHTML(matches) +
                            "</div>";
                    } else if (wantView === "code") {
                        viewWrap.innerHTML = data.rawContent
                            ? '<div class="source-code">' + data.rawContent + "</div>"
                            : '<div class="source-code"><pre>' + esc(data.rawXML || "") + "</pre></div>";
                    } else {
                        viewWrap.innerHTML = treeHTML(matches);
                    }
                }

                // Create toggle
                var toggle = document.createElement("span");
                toggle.className = "view-toggle";
                var btnTree = document.createElement("button");
                btnTree.textContent = "Tree";
                btnTree.className = getViewParam() === "table" || getViewParam() === "code" ? "" : "active";
                var btnTable = document.createElement("button");
                btnTable.textContent = "Table";
                btnTable.className = getViewParam() === "table" ? "active" : "";
                var btnCode = document.createElement("button");
                btnCode.textContent = "Code";
                btnCode.className = getViewParam() === "code" ? "active" : "";
                toggle.appendChild(btnTree);
                toggle.appendChild(btnTable);
                toggle.appendChild(btnCode);
                showFileHeaderBar(toggle, null);
                btnTree.onclick = function () {
                    setViewParam(null);
                    btnTree.className = "active";
                    btnTable.className = "";
                    btnCode.className = "";
                    counts();
                };
                btnTable.onclick = function () {
                    setViewParam("table");
                    btnTree.className = "";
                    btnTable.className = "active";
                    btnCode.className = "";
                    counts();
                };
                btnCode.onclick = function () {
                    setViewParam("code");
                    btnTree.className = "";
                    btnTable.className = "";
                    btnCode.className = "active";
                    counts();
                };

                if (parseError) {
                    setViewParam("code");
                    btnTree.className = "";
                    btnTable.className = "";
                    btnCode.className = "active";
                }
                counts();
                if (parseError) {
                    // matchedEntries clears the message during counts();
                    // set it afterwards so it sticks.
                    invalidMsg.textContent = "XML parse error — showing Code view";
                }
            }

            /* ── WebSocket ────────────────────────────────────────────── */
            var wsRetryCount = 0;
            function connectWS() {
                var proto = location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(proto + "//" + location.host + "/ws");
                ws.onopen = function () {
                    wsRetryCount = 0;
                    hideConnectionError();
                    for (var p of watchedPaths) {
                        ws.send(JSON.stringify({ action: "watch", path: p }));
                    }
                };
                ws.onmessage = function (e) {
                    try {
                        var msg = JSON.parse(e.data);
                        if (msg.path) {
                            refreshTree();
                            if (msg.path === currentFilePath) {
                                loadFile(currentFilePath);
                            }
                        }
                    } catch (err) {}
                };
                ws.onclose = function () {
                    wsRetryCount++;
                    if (wsRetryCount >= 2) {
                        showConnectionError();
                    }
                    setTimeout(connectWS, 2000);
                };
                ws.onerror = function () {
                    ws.close();
                };
            }

            function wsWatch(path) {
                watchedPaths.add(path);
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ action: "watch", path: path }));
                }
            }

            function wsUnwatch(path) {
                watchedPaths.delete(path);
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ action: "unwatch", path: path }));
                }
            }

            /* ── CSV helpers ──────────────────────────────────────────── */
            function parseCSV(text) {
                var lines = [];
                var current = "";
                var inQuotes = false;
                for (var i = 0; i < text.length; i++) {
                    var ch = text[i];
                    if (ch === '"') {
                        if (inQuotes && text[i + 1] === '"') {
                            current += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (ch === "," && !inQuotes) {
                        lines.push(current);
                        current = "";
                    } else if (
                        (ch === "\n" ||
                            (ch === "\r" && text[i + 1] === "\n")) &&
                        !inQuotes
                    ) {
                        if (ch === "\r") i++;
                        lines.push(current);
                        current = "";
                        if (lines.length > 0) {
                            var row = lines;
                            lines = [];
                            return { row: row, rest: text.slice(i + 1) };
                        }
                    } else {
                        current += ch;
                    }
                }
                if (current || lines.length > 0) {
                    lines.push(current);
                }
                return { row: lines.length > 0 ? lines : null, rest: "" };
            }

            function parseCSVAll(text) {
                var rows = [];
                var remaining = text;
                while (remaining) {
                    var result = parseCSV(remaining);
                    if (result.row && result.row.length > 0) {
                        rows.push(result.row);
                    }
                    if (result.rest === remaining) break;
                    remaining = result.rest;
                }
                return rows;
            }

            /* ── CSV filtering ──────────────────────────────────────── */

            // renderCSVTableHTML builds the same table markup the backend
            // renders for CSV files, but from already-parsed rows. Each row
            // needs an "orig" property (its 1-based row number in the full
            // file) so record links in the filtered table jump to the
            // correct record.
            function renderCSVTableHTML(headers, rows) {
                var html = "<table><thead><tr>";
                for (var i = 0; i < headers.length; i++) {
                    html += "<th>" + esc(headers[i]) + "</th>";
                }
                html += '<th class="csv-row-link-header"></th>';
                html += "</tr></thead><tbody>";
                for (var j = 0; j < rows.length; j++) {
                    var row = rows[j];
                    html += "<tr>";
                    for (var k = 0; k < row.length; k++) {
                        html += "<td>" + esc(String(row[k])) + "</td>";
                    }
                    html +=
                        '<td class="csv-row-link"><button class="csv-record-link-btn" data-row="' +
                        row.orig +
                        '" title="View record">→</button></td>';
                    html += "</tr>";
                }
                html += "</tbody></table>";
                return html;
            }

            // csvFilterMatches applies one filter object to a cell value.
            // gt/lt compare numerically and reject non-numeric cells; text
            // comparisons are case-insensitive.
            function csvFilterMatches(cell, filter) {
                var value = String(cell == null ? "" : cell).trim();
                switch (filter.op) {
                    case "contains":
                        return (
                            value
                                .toLowerCase()
                                .indexOf(filter.value.toLowerCase()) !== -1
                        );
                    case "equals":
                        return (
                            value.toLowerCase() === filter.value.toLowerCase()
                        );
                    case "regex":
                        return new RegExp(filter.value, "i").test(value);
                    case "gt":
                    case "lt": {
                        var num = parseFloat(value);
                        if (isNaN(num)) return false;
                        var target = parseFloat(filter.value);
                        return filter.op === "gt"
                            ? num > target
                            : num < target;
                    }
                    case "empty":
                        return value === "";
                    case "not-empty":
                        return value !== "";
                    default:
                        return true;
                }
            }

            // csvFilteredIndices returns the 0-based indices of the rows
            // (objects like { cells: [...], orig: 1 }) matching the active
            // filters, combined with CSV filter mode "all" or "any".
            function csvFilteredIndices(rows, filters, mode) {
                if (!filters.length) {
                    var all = [];
                    for (var i = 0; i < rows.length; i++) all.push(i);
                    return all;
                }
                var out = [];
                for (var j = 0; j < rows.length; j++) {
                    var row = rows[j];
                    var match;
                    if (mode === "any") {
                        match = false;
                        for (var a = 0; a < filters.length; a++) {
                            if (csvFilterMatches(row.cells[filters[a].col], filters[a])) {
                                match = true;
                                break;
                            }
                        }
                    } else {
                        match = true;
                        for (var b = 0; b < filters.length; b++) {
                            if (!csvFilterMatches(row.cells[filters[b].col], filters[b])) {
                                match = false;
                                break;
                            }
                        }
                    }
                    if (match) out.push(j);
                }
                return out;
            }

            /* ── CSV charts (hand-rolled SVG, no deps) ────────────────── */

            var CSV_CHART_COLORS = [
                "#0969da", "#cf6a0c", "#1a7f37", "#cf222e", "#8250df",
                "#953800", "#0e8a8a", "#57606a", "#b359c6", "#6e7f1e",
            ];

            function chartTrunc(s, n) {
                s = String(s);
                return s.length > n ? s.slice(0, n - 1) + "…" : s;
            }

            function fmtChartNum(v) {
                if (!isFinite(v)) return "0";
                var abs = Math.abs(v),
                    s;
                if (abs >= 1e9) s = (v / 1e9).toFixed(1).replace(/\.0$/, "") + "B";
                else if (abs >= 1e6) s = (v / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
                else if (abs >= 1e4) s = (v / 1e3).toFixed(1).replace(/\.0$/, "") + "k";
                else if (abs >= 100) s = String(Math.round(v));
                else if (abs >= 10) s = String(Math.round(v * 10) / 10);
                else s = String(Math.round(v * 100) / 100);
                return s;
            }

            function niceChartMax(v) {
                if (v <= 0) return 1;
                var exp = Math.floor(Math.log(v) / Math.LN10);
                var f = v / Math.pow(10, exp);
                var nf =
                    f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
                return nf * Math.pow(10, exp);
            }

            function csvAggApply(values, agg) {
                if (!values.length) return 0;
                switch (agg) {
                    case "count":
                        return values.length;
                    case "avg":
                        return values.reduce(function (a, b) { return a + b; }, 0) / values.length;
                    case "min":
                        return Math.min.apply(null, values);
                    case "max":
                        return Math.max.apply(null, values);
                    default:
                        return values.reduce(function (a, b) { return a + b; }, 0);
                }
            }

            // hasNumericCells reports whether any cell in the column parses
            // as a finite number — used to build the measure column list and
            // to validate chart data.
            function hasNumericCells(rows, col) {
                for (var i = 0; i < rows.length; i++) {
                    var v = parseFloat(rows[i].cells[col]);
                    if (!isNaN(v) && isFinite(v)) return true;
                }
                return false;
            }

            // csvChartGroups buckets the filtered rows of a CSV by the chart's
            // X column (optionally crossed with a color-by column) and fills
            // each cell with the measure values to aggregate later.
            // Rows without a numeric measure are skipped unless agg=count
            // (count buckets every row).
            function csvChartGroups(parsed, indices, cfg) {
                var buckets = {};
                var order = [];
                var skipped = 0;
                for (var i = 0; i < indices.length; i++) {
                    var row = parsed.rows[indices[i]];
                    var key = String(row.cells[cfg.x] == null ? "" : row.cells[cfg.x]).trim();
                    if (key === "") key = "(blank)";
                    var gkey = "";
                    if (cfg.by != null) {
                        gkey = String(row.cells[cfg.by] == null ? "" : row.cells[cfg.by]).trim();
                        if (gkey === "") gkey = "(blank)";
                    }
                    var mVal = parseFloat(row.cells[cfg.m]);
                    var hasNum = !isNaN(mVal) && isFinite(mVal);
                    if (!hasNum && cfg.agg !== "count") {
                        skipped++;
                        continue;
                    }
                    var b = buckets[key];
                    if (!b) {
                        b = buckets[key] = { key: key, xNum: parseFloat(key), groups: {} };
                        order.push(key);
                    }
                    if (!b.groups[gkey]) b.groups[gkey] = [];
                    b.groups[gkey].push(cfg.agg === "count" ? 1 : mVal);
                }
                // Detect numeric X for line/area/scatter ordering.
                var numericX = order.length > 0 && order.every(function (k) {
                    var v = parseFloat(k);
                    return !isNaN(v) && isFinite(v) && k !== "";
                });
                return {
                    buckets: order.map(function (k) {
                        return buckets[k];
                    }),
                    numericX: numericX,
                    skipped: skipped,
                };
            }

            // chartArcPath draws an annular sector between r0 (0 = pie) and
            // r1 centred on (cx,cy) from angle a0 to a1 (radians, clockwise).
            function chartArcPath(cx, cy, r0, r1, a0, a1) {
                var large = a1 - a0 > Math.PI ? 1 : 0;
                var x0 = cx + Math.cos(a0) * r1, y0 = cy + Math.sin(a0) * r1;
                var x1 = cx + Math.cos(a1) * r1, y1 = cy + Math.sin(a1) * r1;
                if (r0 <= 0) {
                    if (a1 - a0 >= 2 * Math.PI - 0.001) {
                        // Full circle: two half arcs.
                        return (
                            "M " + cx + " " + cy +
                            " L " + (cx - r1).toFixed(2) + " " + cy.toFixed(2) +
                            " A " + r1 + " " + r1 + " 0 1 1 " + (cx + r1).toFixed(2) + " " + cy.toFixed(2) +
                            " A " + r1 + " " + r1 + " 0 1 1 " + (cx - r1).toFixed(2) + " " + cy.toFixed(2) +
                            " Z"
                        );
                    }
                    return (
                        "M " + cx + " " + cy +
                        " L " + x0.toFixed(2) + " " + y0.toFixed(2) +
                        " A " + r1 + " " + r1 + " 0 " + large + " 1 " + x1.toFixed(2) + " " + y1.toFixed(2) +
                        " Z"
                    );
                }
                var xi1 = cx + Math.cos(a1) * r0, yi1 = cy + Math.sin(a1) * r0;
                var xi0 = cx + Math.cos(a0) * r0, yi0 = cy + Math.sin(a0) * r0;
                return (
                    "M " + x0.toFixed(2) + " " + y0.toFixed(2) +
                    " A " + r1 + " " + r1 + " 0 " + large + " 1 " + x1.toFixed(2) + " " + y1.toFixed(2) +
                    " L " + xi1.toFixed(2) + " " + yi1.toFixed(2) +
                    " A " + r0 + " " + r0 + " 0 " + large + " 0 " + xi0.toFixed(2) + " " + yi0.toFixed(2) +
                    " Z"
                );
            }

            function chartGridY(M, plotH, maxV, plotW) {
                var out = "";
                for (var g = 0; g <= 4; g++) {
                    var v = (maxV * g) / 4;
                    var y = M.t + plotH - (v / maxV) * plotH;
                    out +=
                        '<line x1="' + M.l + '" y1="' + y.toFixed(2) +
                        '" x2="' + (M.l + plotW) + '" y2="' + y.toFixed(2) +
                        '" style="stroke:var(--rv-border);stroke-width:1"/>' +
                        '<text x="' + (M.l - 6) + '" y="' + (y + 4).toFixed(2) +
                        '" text-anchor="end" class="chart-tick">' +
                        fmtChartNum(v) + "</text>";
                }
                return out;
            }

            function chartXAxisLine(M, plotW, plotH) {
                return (
                    '<line x1="' + M.l + '" y1="' + (M.t + plotH) +
                    '" x2="' + (M.l + plotW) + '" y2="' + (M.t + plotH) +
                    '" style="stroke:var(--rv-text-tertiary);stroke-width:1"/>'
                );
            }

            function svgOpen(cls, title) {
                return (
                    '<svg class="csv-chart ' + cls + '" viewBox="0 0 860 420" ' +
                    'preserveAspectRatio="xMidYMid meet" role="img" aria-label="' +
                    esc(title) + '">'
                );
            }

            function chartGroupColor(gkeys, legend) {
                if (!legend.length) return CSV_CHART_COLORS[0];
                for (var i = 0; i < legend.length; i++) {
                    if (legend[i].key === gkeys) return legend[i].color;
                }
                return CSV_CHART_COLORS[0];
            }

            // Grouped-bar geometry shared by bar / stacked. cfg carries the
            // real aggregation (agg) plus the layout mode: "single" = one
            // untinted bar per X bucket, "group" = a bar per colour entry,
            // "stack" = colour segments stacked on one bar. The axis max is
            // computed from the same aggregated numbers the bars draw, so
            // the scale stays consistent without a colour column too.
            function renderCSVGroupedBars(buckets, legend, cfg, opts) {
                var W = 860, H = 420, M = { l: 56, r: 20, t: 20, b: 96 };
                var plotW = W - M.l - M.r, plotH = H - M.t - M.b;
                var gkeys = legend.map(function (l) { return l.key; });
                var mode = cfg.mode || "single";
                // Compute per-bucket values, derive the axis max.
                var rows = buckets.map(function (b) {
                    if (mode === "single") {
                        var all = b.groups[""] || [];
                        return all.length ? [csvAggApply(all, cfg.agg)] : [];
                    }
                    return gkeys
                        .filter(function (g) {
                            return b.groups[g] != null;
                        })
                        .map(function (g) {
                            return csvAggApply(b.groups[g], cfg.agg);
                        });
                });
                var maxV = 0;
                rows.forEach(function (vals) {
                    if (mode === "stack") {
                        var t = vals.reduce(function (a, b) { return a + b; }, 0);
                        if (t > maxV) maxV = t;
                    } else {
                        vals.forEach(function (v) {
                            if (v > maxV) maxV = v;
                        });
                    }
                });
                maxV = niceChartMax(maxV);
                var step = plotW / buckets.length;
                var bw = Math.min(56, Math.max(4, step * 0.62));
                var parts = chartGridY(M, plotH, maxV, plotW);
                buckets.forEach(function (b, bi) {
                    if (mode === "single") {
                        var v = rows[bi][0];
                        var h = Math.min(1, v / maxV) * plotH;
                        if (h > 0) {
                            var x = M.l + bi * step + (step - bw) / 2;
                            var y = M.t + plotH - h;
                            parts +=
                                '<rect class="chart-rect" x="' + x.toFixed(2) + '" y="' + y.toFixed(2) +
                                '" width="' + bw.toFixed(2) + '" height="' + h.toFixed(2) +
                                '" fill="' + CSV_CHART_COLORS[0] + '">' +
                                "<title>" + esc(b.key + ": " + fmtChartNum(v)) + "</title></rect>";
                        }
                    } else {
                        // Grouped (not stacked) or trimmed stacked bars; per
                        // segment we re-aggregate the same numbers used by
                        // the max above.
                        var yBase = M.t + plotH;
                        var yAcc = yBase;
                        gkeys
                            .filter(function (g) {
                                return b.groups[g] != null;
                            })
                            .forEach(function (g, gi) {
                                var v = csvAggApply(b.groups[g], cfg.agg);
                                if (v <= 0) return;
                                var color = chartGroupColor(g, legend);
                                if (mode === "stack") {
                                    var hS = Math.min(yAcc - M.t, (v / maxV) * plotH);
                                    yAcc -= hS;
                                    parts +=
                                        '<rect class="chart-rect" x="' + (M.l + bi * step + (step - bw) / 2).toFixed(2) +
                                        '" y="' + yAcc.toFixed(2) + '" width="' + bw.toFixed(2) +
                                        '" height="' + hS.toFixed(2) + '" fill="' + color + '">' +
                                        "<title>" + esc(b.key + " / " + g + ": " + fmtChartNum(v)) + "</title></rect>";
                                } else {
                                    var bwG = Math.min(24, Math.max(3, (bw / gkeys.length) * 0.9));
                                    var xG = M.l + bi * step + (step - bw) / 2 + gi * ((bw - bwG) / (gkeys.length - 1 || 1));
                                    var hG = (Math.min(1, v / maxV)) * plotH;
                                    parts +=
                                        '<rect class="chart-rect" x="' + xG.toFixed(2) + '" y="' + (yBase - hG).toFixed(2) +
                                        '" width="' + bwG.toFixed(2) + '" height="' + hG.toFixed(2) +
                                        '" fill="' + color + '">' +
                                        "<title>" + esc(b.key + " / " + g + ": " + fmtChartNum(v)) + "</title></rect>";
                                }
                            });
                    }
                    var lx = M.l + bi * step + step / 2;
                    var ly = M.t + plotH + 6;
                    parts +=
                        '<text transform="rotate(-40 ' + lx.toFixed(2) + " " + ly.toFixed(2) + ')" x="' +
                        lx.toFixed(2) + '" y="' + (ly + 10).toFixed(2) +
                        '" text-anchor="end" class="chart-tick">' +
                        esc(chartTrunc(b.key, 16)) + "</text>";
                });
                parts += chartXAxisLine(M, plotW, plotH);
                return parts;
            }

            // buildPieSVG draws a pie (donut=false) or donut from slice
            // objects { key, v } whose values are already aggregated.
            function buildPieSVG(slices, agg, donut) {
                var W = 860, H = 420;
                var cx = W / 2, cy = H / 2 + 6;
                var r1 = Math.min(W, H) / 2 - 56;
                var r0 = donut ? r1 * 0.58 : 0;
                var usable = slices.filter(function (s) { return s.v > 0; });
                var total = usable.reduce(function (t, s) { return t + s.v; }, 0);
                if (total <= 0) {
                    return {
                        parts:
                            '<text x="' + cx + '" y="' + cy +
                            '" text-anchor="middle" class="chart-center">nothing to plot</text>',
                    };
                }
                var parts = "";
                var a = -Math.PI / 2;
                usable.forEach(function (s, i) {
                    var a1 = a + (s.v / total) * 2 * Math.PI;
                    var color = CSV_CHART_COLORS[i % CSV_CHART_COLORS.length];
                    parts +=
                        '<path class="chart-slice" d="' +
                        chartArcPath(cx, cy, r0, r1, a, a1 - 0.004) +
                        '" fill="' + color + '"><title>' +
                        esc(s.key + ": " + fmtChartNum(s.v) +
                            " (" + Math.round((s.v / total) * 100) + "%)") +
                        "</title></path>";
                    a = a1;
                });
                if (donut) {
                    parts +=
                        '<text x="' + cx + '" y="' + (cy + 5) +
                        '" text-anchor="middle" class="chart-center">' +
                        esc(fmtChartNum(total) + (agg === "count" ? " rows" : "")) +
                        "</text>";
                }
                return { parts: parts };
            }

            // renderCSVHBarChart draws horizontal bars from pre-aggregated
            // rows [{ key, value }], labels left, value right of each bar.
            function renderCSVHBarChart(rows, agg) {
                var W = 860, H = 420;
                var labelX = 160, barX = 170;
                var barRight = W - 78;
                var n = rows.length;
                var rowH = Math.min(30, (H - 60) / Math.max(1, n));
                var top = (H - n * rowH) / 2 + 10;
                var maxV = niceChartMax(
                    rows.reduce(function (m, r) { return Math.max(m, r.value); }, 0),
                );
                var parts = "";
                if (maxV > 0) {
                    for (var g = 1; g <= 4; g++) {
                        var vx = barX + ((barRight - barX) * g) / 4;
                        parts +=
                            '<text x="' + vx.toFixed(2) + '" y="' + (top + n * rowH + 18).toFixed(2) +
                            '" text-anchor="middle" class="chart-tick">' +
                            fmtChartNum((maxV * g) / 4) + "</text>";
                    }
                }
                rows.forEach(function (r, i) {
                    var y = top + i * rowH;
                    var cy = y + rowH / 2;
                    var bw = Math.min(1, Math.abs(r.value) / maxV) * (barRight - barX);
                    parts +=
                        '<text x="' + labelX + '" y="' + (cy + 4).toFixed(2) +
                        '" text-anchor="end" class="chart-label">' +
                        esc(chartTrunc(r.key, 22)) + "</text>";
                    if (bw > 0) {
                        parts +=
                            '<rect class="chart-rect" x="' + barX + '" y="' + (cy - Math.min(14, rowH * 0.36)).toFixed(2) +
                            '" width="' + bw.toFixed(2) + '" height="' +
                            Math.min(28, rowH * 0.72).toFixed(2) +
                            '" fill="' + CSV_CHART_COLORS[0] + '"><title>' +
                            esc(r.key + ": " + fmtChartNum(r.value)) + "</title></rect>";
                        parts +=
                            '<text x="' + (barX + bw + 6).toFixed(2) + '" y="' + (cy + 4).toFixed(2) +
                            '" class="chart-tick">' + fmtChartNum(r.value) + "</text>";
                    }
                });
                parts +=
                    '<line x1="' + barX + '" y1="' + (top - 10).toFixed(2) + '" x2="' + barX + '" y2="' +
                    (top + n * rowH + 2).toFixed(2) +
                    '" style="stroke:var(--rv-text-tertiary);stroke-width:1"/>';
                return parts;
            }

            function renderCSVLineChart(g, legend, cfg, area) {
                var buckets = g.buckets;
                var W = 860, H = 420, M = { l: 56, r: 20, t: 20, b: 60 };
                var plotW = W - M.l - M.r, plotH = H - M.t - M.b;
                var gkeys = legend.length ? legend.map(function (l) { return l.key; }) : [""];
                var order = buckets.map(function (b, i) { return { b: b, i: i }; });
                if (g.numericX) {
                    order.sort(function (x, y) { return x.b.xNum - y.b.xNum; });
                }
                var series = gkeys.map(function (g) {
                    return {
                        key: g,
                        pts: [],
                    };
                });
                var maxV = 0;
                series.forEach(function (s) {
                    order.forEach(function (o) {
                        var v = o.b.groups[s.key] ? csvAggApply(o.b.groups[s.key], cfg.agg) : 0;
                        s.pts.push({ x: o.i, v: v, key: o.b.key });
                        if (v > maxV) maxV = v;
                    });
                });
                maxV = niceChartMax(maxV);
                var stepX = plotW / Math.max(1, order.length - 1) || plotW;
                if (order.length === 1) stepX = plotW / 2;
                var parts = chartGridY(M, plotH, maxV, plotW);
                // X ticks: first/middle/last
                var showXIdx = {};
                if (order.length > 0) {
                    showXIdx[0] = true;
                    showXIdx[order.length - 1] = true;
                    if (order.length > 2) showXIdx[Math.floor(order.length / 2)] = true;
                    if (order.length > 5) {
                        showXIdx[Math.floor(order.length / 4)] = true;
                        showXIdx[order.length - 1 - Math.floor(order.length / 4)] = true;
                    }
                }
                series.forEach(function (s, si) {
                    var color = s.key === "" ? CSV_CHART_COLORS[0] : chartGroupColor(s.key, legend);
                    var dLine = "";
                    s.pts.forEach(function (p, pi) {
                        var x = M.l + pi * (stepX || plotW / Math.max(1, s.pts.length - 1));
                        var y = M.t + plotH - (Math.min(1, p.v / maxV)) * plotH;
                        dLine += (pi === 0 ? "M " : " L ") + x.toFixed(2) + " " + y.toFixed(2);
                        if (showXIdx[pi]) {
                            parts +=
                                '<text x="' + x.toFixed(2) + '" y="' + (M.t + plotH + 14) +
                                '" text-anchor="middle" class="chart-tick">' +
                                esc(chartTrunc(p.key, 10)) + "</text>";
                        }
                        if (s.pts.length === 1) {
                            parts +=
                                '<circle class="chart-dot" cx="' + x.toFixed(2) + '" cy="' + y.toFixed(2) +
                                '" r="4" fill="' + color + '"><title>' + esc(p.key + ": " + fmtChartNum(p.v)) +
                                "</title></circle>";
                        }
                    });
                    if (area && s.pts.length) {
                        var lastX = M.l + (s.pts.length - 1) * (stepX || plotW / Math.max(1, s.pts.length - 1));
                        var pPath = dLine + " L " + lastX.toFixed(2) + " " + (M.t + plotH) +
                            " L " + M.l + " " + (M.t + plotH) + " Z";
                        parts +=
                            '<path class="chart-area" d="' + pPath + '" fill="' + color +
                            '" style="fill-opacity:0.14;stroke:none"/>';
                    }
                    parts +=
                        '<path class="chart-line" d="' + dLine + '" fill="none" stroke="' + color +
                        '" style="stroke-width:2"/><title>' + esc(s.key === "" ? "" : s.key) + "</title></path>";
                });
                parts += chartXAxisLine(M, plotW, plotH);
                return parts;
            }

            function renderCSVScatterChart(parsed, indices, cfg) {
                var W = 860, H = 420, M = { l: 56, r: 20, t: 20, b: 52 };
                var plotW = W - M.l - M.r, plotH = H - M.t - M.b;
                var pts = [];
                var minX = Infinity, maxX = -Infinity, maxY = -Infinity;
                for (var i = 0; i < indices.length; i++) {
                    var row = parsed.rows[indices[i]];
                    var xv = parseFloat(row.cells[cfg.x]);
                    var yv = parseFloat(row.cells[cfg.m]);
                    if (isNaN(xv) || !isFinite(xv) || isNaN(yv) || !isFinite(yv)) continue;
                    pts.push({
                        x: xv, y: yv,
                        gkey: cfg.by == null ? "" : String(row.cells[cfg.by] == null ? "" : row.cells[cfg.by]).trim() || "(blank)",
                        label: row.cells[cfg.x] + " / " + row.cells[cfg.m],
                    });
                    if (xv < minX) minX = xv;
                    if (xv > maxX) maxX = xv;
                    if (yv > maxY) maxY = yv;
                }
                if (!pts.length) return null;
                if (maxX === minX) { maxX = minX + 1; }
                var niceY = niceChartMax(maxY);
                var parts = "";
                for (var g = 0; g <= 4; g++) {
                    var v = (niceY * g) / 4;
                    var y = M.t + plotH - (v / niceY) * plotH;
                    parts +=
                        '<line x1="' + M.l + '" y1="' + y.toFixed(2) + '" x2="' + (M.l + plotW) + '" y2="' + y.toFixed(2) +
                        '" style="stroke:var(--rv-border);stroke-width:1"/>' +
                        '<text x="' + (M.l - 6) + '" y="' + (y + 4).toFixed(2) + '" text-anchor="end" class="chart-tick">' +
                        fmtChartNum(v) + "</text>";
                }
                // X ticks at both ends
                var xt = [minX, (minX + maxX) / 2, maxX];
                var sx = function (v) { return M.l + ((v - minX) / (maxX - minX)) * plotW; };
                xt.forEach(function (v) {
                    parts +=
                        '<text x="' + sx(v).toFixed(2) + '" y="' + (M.t + plotH + 18) +
                        '" text-anchor="middle" class="chart-tick">' + fmtChartNum(v) + "</text>";
                });
                var legend = [];
                var groupsSeen = {};
                pts.forEach(function (p) {
                    if (!groupsSeen[p.gkey]) {
                        groupsSeen[p.gkey] = true;
                        if (legend.length < CSV_CHART_COLORS.length) {
                            legend.push({ key: p.gkey || null, color: CSV_CHART_COLORS[legend.length] });
                        }
                    }
                });
                if (!cfg.by) legend = [];
                pts.forEach(function (p) {
                    var color = CSV_CHART_COLORS[0];
                    if (cfg.by) {
                        for (var li = 0; li < legend.length; li++) {
                            if (legend[li].key === p.gkey) color = legend[li].color;
                        }
                    }
                    var x = M.l + ((p.x - minX) / (maxX - minX)) * plotW;
                    var y = M.t + plotH - (p.y / niceY) * plotH;
                    parts +=
                        '<circle class="chart-dot" cx="' + x.toFixed(2) + '" cy="' + y.toFixed(2) +
                        '" r="4" fill="' + color + '"><title>' + esc(String(p.label) + " (" + p.gkey + ")") +
                        "</title></circle>";
                });
                parts +=
                    '<line x1="' + M.l + '" y1="' + (M.t + plotH) + '" x2="' + (M.l + plotW) + '" y2="' + (M.t + plotH) +
                    '" style="stroke:var(--rv-text-tertiary);stroke-width:1"/>';
                return { parts: parts, legend: legend };
            }

            // renderCSVChart builds the SVG markup for the requested chart
            // type: { svg, legend, title } or { empty: "reason" }. Pure SVG,
            // no libraries; data comes pre-filtered via csvFilteredIndices.
            function renderCSVChart(parsed, indices, cfg) {
                if (!indices.length) {
                    return { empty: "No rows match the active filters." };
                }
                if (cfg.agg !== "count" && !hasNumericCells(parsed.rows, cfg.m)) {
                    return { empty: "The measure column has no numeric values." };
                }

                function colName(ci) {
                    return ci == null ? "" : String(parsed.headers[ci] == null ? "?" : parsed.headers[ci]);
                }

                function chartTitle() {
                    var t;
                    if (cfg.agg === "count") t = "row count by " + colName(cfg.x);
                    else t = cfg.agg + "(" + colName(cfg.m) + ") by " + colName(cfg.x);
                    if (cfg.by != null && cfg.type !== "pie" && cfg.type !== "donut") {
                        t += " · colour: " + colName(cfg.by);
                    }
                    return t;
                }

                function legendFor(buckets) {
                    var legend = [];
                    if (cfg.by == null) return legend;
                    var seen = {};
                    buckets.forEach(function (b) {
                        Object.keys(b.groups).forEach(function (gk) {
                            if (!seen[gk]) {
                                seen[gk] = true;
                                if (legend.length < CSV_CHART_COLORS.length) {
                                    legend.push({ key: gk, color: CSV_CHART_COLORS[legend.length] });
                                }
                            }
                        });
                    });
                    return legend;
                }

                function bucketTotal(b, agg) {
                    var t = 0;
                    Object.keys(b.groups).forEach(function (gk) {
                        t += csvAggApply(b.groups[gk], agg);
                    });
                    return t;
                }

                var type = cfg.type;

                if (type === "bar" || type === "hbar") {
                    var gBar = csvChartGroups(parsed, indices, cfg);
                    if (!gBar.buckets.length) {
                        return { empty: "Nothing to plot for the chosen measure." };
                    }
                    var legendBar = legendFor(gBar.buckets);
                    var byAgg = cfg.agg;
                    var rowsBar = gBar.buckets.map(function (b) {
                        return {
                            key: b.key,
                            value: cfg.by == null
                                ? csvAggApply(b.groups[""] || [], byAgg)
                                : bucketTotal(b, byAgg),
                        };
                    });
                    rowsBar.sort(function (x, y) { return y.value - x.value; });
                    var capped = rowsBar;
                    if (rowsBar.length > 40) {
                        var restSum = rowsBar.slice(40).reduce(function (t, r) { return t + r.value; }, 0);
                        capped = rowsBar.slice(0, 40);
                        capped.push({ key: "Other", value: restSum });
                    }
                    var partsBar;
                    if (type === "bar") {
                        // Grouped bars: when a colour column is set each X
                        // bucket shows one bar per colour entry.
                        var bucketObjs = {};
                        gBar.buckets.forEach(function (b) { bucketObjs[b.key] = b; });
                        var asBuckets = capped.map(function (r) {
                            return bucketObjs[r.key] || { key: r.key, groups: { "": [r.value] } };
                        });
                        partsBar = renderCSVGroupedBars(asBuckets, legendBar, {
                            agg: byAgg,
                            mode: legendBar.length ? "group" : "single",
                        });
                    } else {
                        partsBar = renderCSVHBarChart(capped, byAgg);
                    }
                    return {
                        svg: svgOpen("chart-" + type, chartTitle()) + partsBar + "</svg>",
                        legend: legendBar.map(function (l) {
                            return '<span class="chart-legend-item"><i style="background:' + l.color + '"></i>' +
                                esc(String(l.key)) + "</span>";
                        }).join(""),
                        title: chartTitle(),
                    };
                }

                if (type === "stacked") {
                    if (cfg.by == null) {
                        return { empty: "Pick a colour column to stack the bars." };
                    }
                    var gSt = csvChartGroups(parsed, indices, cfg);
                    if (!gSt.buckets.length) {
                        return { empty: "Nothing to plot for the chosen measure." };
                    }
                    var legendSt = legendFor(gSt.buckets);
                    var partsSt = renderCSVGroupedBars(gSt.buckets, legendSt, {
                        agg: cfg.agg,
                        mode: "stack",
                    });
                    return {
                        svg: svgOpen("chart-stacked", chartTitle()) + partsSt + "</svg>",
                        legend: legendSt.map(function (l) {
                            return '<span class="chart-legend-item"><i style="background:' + l.color + '"></i>' +
                                esc(String(l.key)) + "</span>";
                        }).join(""),
                        title: chartTitle(),
                    };
                }

                if (type === "pie" || type === "donut") {
                    var gPie = csvChartGroups(
                        parsed,
                        indices,
                        { x: cfg.x, m: cfg.m, by: null, agg: cfg.agg },
                    );
                    if (!gPie.buckets.length) {
                        return { empty: "Nothing to plot for the chosen measure." };
                    }
                    var scored = gPie.buckets.map(function (b) {
                        return { key: b.key, v: csvAggApply(b.groups[""] || [], cfg.agg) };
                    });
                    scored.sort(function (x, y) { return y.v - x.v; });
                    var keep = scored.slice(0, 9);
                    var restV = scored.slice(9).reduce(function (t, s) { return t + s.v; }, 0);
                    if (restV > 0) keep.push({ key: "Other (" + (scored.length - 9) + ")", v: restV });
                    var pie = buildPieSVG(keep, cfg.agg, type === "donut");
                    return {
                        svg: svgOpen("chart-" + type, chartTitle()) + pie.parts + "</svg>",
                        legend: keep.map(function (s, i) {
                            return '<span class="chart-legend-item"><i style="background:' +
                                CSV_CHART_COLORS[i % CSV_CHART_COLORS.length] + '"></i>' +
                                esc(String(s.key)) + "</span>";
                        }).join(""),
                        title: chartTitle(),
                    };
                }

                if (type === "line" || type === "area") {
                    var gLine = csvChartGroups(parsed, indices, cfg);
                    if (!gLine.buckets.length) {
                        return { empty: "Nothing to plot for the chosen measure." };
                    }
                    var legendLine = legendFor(gLine.buckets);
                    var partsLine = renderCSVLineChart(gLine, legendLine, {
                        agg: cfg.agg,
                    }, type === "area");
                    return {
                        svg: svgOpen("chart-" + type, chartTitle()) + partsLine + "</svg>",
                        legend: legendLine.map(function (l) {
                            return '<span class="chart-legend-item"><i style="background:' + l.color + '"></i>' +
                                esc(String(l.key)) + "</span>";
                        }).join(""),
                        title: chartTitle(),
                    };
                }

                if (type === "scatter") {
                    var sc = renderCSVScatterChart(parsed, indices, cfg);
                    if (!sc) {
                        return { empty: "Scatter needs numeric values in both the X and measure columns." };
                    }
                    var legendScHTML = "";
                    (sc.legend || []).forEach(function (l) {
                        legendScHTML +=
                            '<span class="chart-legend-item"><i style="background:' + l.color + '"></i>' +
                            esc(String(l.key == null ? "" : l.key)) + "</span>";
                    });
                    return {
                        svg: svgOpen("chart-scatter", chartTitle()) + sc.parts + "</svg>",
                        legend: legendScHTML,
                        title: chartTitle(),
                    };
                }

                return { empty: "Unknown chart type." };
            }

            function renderCSVRecords(headers, rows) {
                var html = '<div class="csv-records">';
                for (var i = 0; i < rows.length; i++) {
                    var row = rows[i];
                    html +=
                        '<div class="csv-record-card" id="record-' +
                        (i + 1) +
                        '">';
                    html +=
                        '<div class="record-header">Record ' +
                        (i + 1) +
                        "</div>";
                    html += '<div class="record-fields">';
                    for (var j = 0; j < headers.length; j++) {
                        var value = j < row.length ? row[j] : "";
                        html += '<div class="field-row">';
                        html +=
                            '<div class="field-label">' +
                            esc(headers[j]) +
                            "</div>";
                        html +=
                            '<div class="field-value">' + esc(value) + "</div>";
                        html += "</div>";
                    }
                    html += "</div></div>";
                }
                html += "</div>";
                return html;
            }

            function scrollToRecord(index) {
                var el = document.getElementById("record-" + index);
                if (el) {
                    el.scrollIntoView({ behavior: "smooth", block: "start" });
                }
            }

            function getRecordParam() {
                var params = new URLSearchParams(location.search);
                return params.get("r");
            }

            function getAsParam() {
                var params = new URLSearchParams(location.search);
                return params.get("as");
            }

            function setAsParam(as) {
                var params = new URLSearchParams(location.search);
                if (as) {
                    params.set("as", as);
                } else {
                    params.delete("as");
                }
                var qs = params.toString();
                var url = location.pathname + (qs ? "?" + qs : "");
                history.replaceState(null, "", url);
            }

            function setRecordParam(index) {
                var params = new URLSearchParams(location.search);
                if (index) {
                    params.set("r", index);
                } else {
                    params.delete("r");
                }
                var qs = params.toString();
                var url = location.pathname + (qs ? "?" + qs : "");
                history.replaceState(null, "", url);
            }

            /* ── JSONL viewer ───────────────────────────────────────── */
            var jsonlState = {
                path: null,
                page: 1,
                pageSize: 100,
                totalLines: 0,
                viewMode: "list",
                data: null,
            };

            async function renderJSONLViewer(path, data) {
                var area = document.getElementById("content-area");

                // Initialize state
                jsonlState.path = path;
                jsonlState.page = 1;
                jsonlState.pageSize = 100;

                // Load first page
                await loadJSONLPage();

                // Create view toggle
                var toggle = document.createElement("span");
                toggle.className = "view-toggle";

                var btnList = document.createElement("button");
                btnList.textContent = "List";
                btnList.className = "active";

                var btnCompact = document.createElement("button");
                btnCompact.textContent = "Compact";

                var btnRaw = document.createElement("button");
                btnRaw.textContent = "Raw";

                toggle.appendChild(btnList);
                toggle.appendChild(btnCompact);
                toggle.appendChild(btnRaw);

                // Page size selector
                var pageSizeControl = document.createElement("span");
                pageSizeControl.className = "jsonl-page-size";
                pageSizeControl.innerHTML =
                    'Per page: <select id="jsonl-page-size-select">' +
                    '<option value="50">50</option>' +
                    '<option value="100" selected>100</option>' +
                    '<option value="200">200</option>' +
                    '<option value="500">500</option>' +
                    "</select>";

                showFileHeaderBar(toggle, null);

                // Add page size selector to header
                var headerBar = document.getElementById("file-header-bar");
                var metaEl = headerBar.querySelector(".file-header-meta");
                metaEl.appendChild(pageSizeControl);

                // Event handlers
                btnList.onclick = function () {
                    jsonlState.viewMode = "list";
                    btnList.className = "active";
                    btnCompact.className = "";
                    btnRaw.className = "";
                    renderJSONLContent();
                };

                btnCompact.onclick = function () {
                    jsonlState.viewMode = "compact";
                    btnCompact.className = "active";
                    btnList.className = "";
                    btnRaw.className = "";
                    renderJSONLContent();
                };

                btnRaw.onclick = function () {
                    jsonlState.viewMode = "raw";
                    btnRaw.className = "active";
                    btnList.className = "";
                    btnCompact.className = "";
                    renderJSONLContent();
                };

                document.getElementById(
                    "jsonl-page-size-select",
                ).onchange = async function (e) {
                    jsonlState.pageSize = parseInt(e.target.value);
                    jsonlState.page = 1;
                    await loadJSONLPage();
                };
            }

            async function loadJSONLPage() {
                var area = document.getElementById("content-area");
                area.innerHTML =
                    '<div class="jsonl-loading">Loading...</div>';

                var url =
                    "/api/jsonl?path=" +
                    encodeURIComponent(jsonlState.path) +
                    "&page=" +
                    jsonlState.page +
                    "&pageSize=" +
                    jsonlState.pageSize;

                var result = await apiFetch(url);
                if (!result.ok) {
                    area.innerHTML =
                        '<div class="welcome"><h2>Error loading JSONL</h2><p>' +
                        esc(result.error || "Unknown error") +
                        "</p></div>";
                    return;
                }

                jsonlState.data = result.data;
                jsonlState.totalLines = result.data.totalLines;
                renderJSONLContent();
            }

            function renderJSONLContent() {
                var area = document.getElementById("content-area");
                var data = jsonlState.data;

                if (!data || !data.records || data.records.length === 0) {
                    area.innerHTML =
                        '<div class="welcome"><h2>Empty JSONL file</h2><p>No records found.</p></div>';
                    return;
                }

                var html = "";

                // Add pagination at top
                html += renderJSONLPagination(data, "top");

                if (jsonlState.viewMode === "list") {
                    html += renderJSONLListView(data);
                } else if (jsonlState.viewMode === "compact") {
                    html += renderJSONLCompactView(data);
                } else if (jsonlState.viewMode === "raw") {
                    html += renderJSONLRawView(data);
                }

                // Add pagination at bottom
                html += renderJSONLPagination(data, "bottom");

                area.innerHTML = html;
                bindJSONLPaginationEvents();
                bindJSONLCompactViewEvents();
            }

            function renderJSONLListView(data) {
                var html = '<div class="jsonl-container">';
                var startRecord =
                    (jsonlState.page - 1) * jsonlState.pageSize + 1;

                data.records.forEach(function (record, idx) {
                    var recordNum = startRecord + idx;
                    html += '<div class="jsonl-record-card" id="jsonl-record-' + recordNum + '">';
                    html += '<div class="jsonl-record-header">';
                    html +=
                        '<span class="jsonl-record-number">Record ' +
                        recordNum +
                        "</span>";
                    html += "</div>";

                    // Check if this record has a parse error
                    var hasError =
                        data.parseErrors &&
                        data.parseErrors.some(function (err) {
                            return err.startsWith("Line " + recordNum);
                        });

                    if (hasError) {
                        html += '<div class="jsonl-record-error">';
                        var errorMsg = data.parseErrors.find(function (err) {
                            return err.startsWith("Line " + recordNum);
                        });
                        html += "Parse Error: " + esc(errorMsg);
                        html += "</div>";
                    }

                    html += '<div class="jsonl-record-content">';
                    html += "<pre><code>" + esc(record) + "</code></pre>";
                    html += "</div>";
                    html += "</div>";
                });

                html += "</div>";
                return html;
            }

            function renderJSONLCompactView(data) {
                var html = '<div class="jsonl-compact-table">';
                html += "<table>";
                html += "<thead><tr>";
                html += "<th>Line</th>";
                html += "<th>JSON Preview</th>";
                html += "<th>Actions</th>";
                html += "</tr></thead>";
                html += "<tbody>";

                var startRecord =
                    (jsonlState.page - 1) * jsonlState.pageSize + 1;

                data.records.forEach(function (record, idx) {
                    var recordNum = startRecord + idx;
                    // Show first 100 chars of minified JSON
                    var preview = record.replace(/\s+/g, " ").substring(0, 100);
                    if (record.length > 100) preview += "...";

                    html += '<tr data-record="' + recordNum + '">';
                    html += "<td>" + recordNum + "</td>";
                    html += "<td>" + esc(preview) + "</td>";
                    html += '<td class="jsonl-actions-cell">';
                    html += '<button class="jsonl-action-btn jsonl-expand-btn" data-record="' + recordNum + '">Expand</button>';
                    html += '<button class="jsonl-action-btn jsonl-view-list-btn" data-record="' + recordNum + '">View in List</button>';
                    html += "</td>";
                    html += "</tr>";

                    // Expanded row (hidden by default)
                    html += '<tr class="jsonl-compact-expanded" data-expanded-for="' + recordNum + '">';
                    html += '<td colspan="3">';
                    html += '<pre><code>' + esc(record) + '</code></pre>';
                    html += '</td>';
                    html += '</tr>';
                });

                html += "</tbody></table>";
                html += "</div>";
                return html;
            }

            function renderJSONLRawView(data) {
                var html = '<div class="jsonl-raw">';
                html += "<pre><code>";

                data.records.forEach(function (record) {
                    // Minify for raw view
                    var minified = record.replace(/\s+/g, " ").trim();
                    html += esc(minified) + "\n";
                });

                html += "</code></pre>";
                html += "</div>";
                return html;
            }

            function renderJSONLPagination(data, position) {
                var totalPages = Math.ceil(
                    jsonlState.totalLines / jsonlState.pageSize,
                );
                var startRecord =
                    (jsonlState.page - 1) * jsonlState.pageSize + 1;
                var endRecord = Math.min(
                    jsonlState.page * jsonlState.pageSize,
                    jsonlState.totalLines,
                );

                var suffix = position === "top" ? "-top" : "-bottom";
                var html = '<div class="jsonl-pagination">';

                // Previous button
                html +=
                    '<button class="jsonl-prev-btn" data-position="' + position + '" ' +
                    (jsonlState.page <= 1 ? "disabled" : "") +
                    ">← Previous</button>";

                // Page info
                html += '<span class="jsonl-pagination-info">';
                html +=
                    "Showing " +
                    startRecord +
                    "-" +
                    endRecord +
                    " of " +
                    jsonlState.totalLines +
                    " records";
                html +=
                    " (Page " +
                    jsonlState.page +
                    " of " +
                    totalPages +
                    ")";
                html += "</span>";

                // Jump to page
                html += '<span class="jsonl-pagination-jump">';
                html += "<span>Go to:</span>";
                html +=
                    '<input type="number" class="jsonl-page-input" min="1" max="' +
                    totalPages +
                    '" value="' +
                    jsonlState.page +
                    '">';
                html += '<button class="jsonl-jump-btn" data-position="' + position + '">Go</button>';
                html += "</span>";

                // Next button
                html +=
                    '<button class="jsonl-next-btn" data-position="' + position + '" ' +
                    (!data.hasMore ? "disabled" : "") +
                    ">Next →</button>";

                html += "</div>";

                return html;
            }

            function bindJSONLPaginationEvents() {
                var prevBtns = document.querySelectorAll(".jsonl-prev-btn");
                var nextBtns = document.querySelectorAll(".jsonl-next-btn");
                var jumpBtns = document.querySelectorAll(".jsonl-jump-btn");
                var pageInputs = document.querySelectorAll(".jsonl-page-input");

                prevBtns.forEach(function (btn) {
                    btn.onclick = async function () {
                        if (jsonlState.page > 1) {
                            jsonlState.page--;
                            await loadJSONLPage();
                        }
                    };
                });

                nextBtns.forEach(function (btn) {
                    btn.onclick = async function () {
                        if (jsonlState.data.hasMore) {
                            jsonlState.page++;
                            await loadJSONLPage();
                        }
                    };
                });

                jumpBtns.forEach(function (btn, idx) {
                    var pageInput = pageInputs[idx];
                    if (pageInput) {
                        var jumpToPage = async function () {
                            var targetPage = parseInt(pageInput.value);
                            var totalPages = Math.ceil(
                                jsonlState.totalLines / jsonlState.pageSize,
                            );

                            if (targetPage >= 1 && targetPage <= totalPages) {
                                jsonlState.page = targetPage;
                                await loadJSONLPage();
                            } else {
                                alert(
                                    "Please enter a page number between 1 and " +
                                        totalPages,
                                );
                            }
                        };

                        btn.onclick = jumpToPage;
                        pageInput.onkeypress = function (e) {
                            if (e.key === "Enter") {
                                jumpToPage();
                            }
                        };
                    }
                });
            }

            function bindJSONLCompactViewEvents() {
                // Expand/collapse buttons
                var expandBtns = document.querySelectorAll(".jsonl-expand-btn");
                expandBtns.forEach(function (btn) {
                    btn.onclick = function () {
                        var recordNum = btn.getAttribute("data-record");
                        var expandedRow = document.querySelector(
                            '.jsonl-compact-expanded[data-expanded-for="' + recordNum + '"]'
                        );

                        if (expandedRow) {
                            var isVisible = expandedRow.classList.contains("visible");
                            if (isVisible) {
                                expandedRow.classList.remove("visible");
                                btn.textContent = "Expand";
                            } else {
                                expandedRow.classList.add("visible");
                                btn.textContent = "Collapse";
                            }
                        }
                    };
                });

                // View in List buttons
                var viewListBtns = document.querySelectorAll(".jsonl-view-list-btn");
                viewListBtns.forEach(function (btn) {
                    btn.onclick = async function () {
                        var recordNum = parseInt(btn.getAttribute("data-record"));

                        // Calculate which page the record is on
                        var targetPage = Math.ceil(recordNum / jsonlState.pageSize);

                        // Switch to list view
                        jsonlState.viewMode = "list";

                        // Load the page if different
                        if (targetPage !== jsonlState.page) {
                            jsonlState.page = targetPage;
                            await loadJSONLPage();
                        } else {
                            renderJSONLContent();
                        }

                        // Update view toggle buttons
