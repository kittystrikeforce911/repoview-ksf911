            /* ── File loading ─────────────────────────────────────────── */
            function rewriteMarkdownImages(container, filePath) {
                var dir = filePath.split("/").slice(0, -1).join("/");
                container.querySelectorAll("img").forEach(function (img) {
                    var src = img.getAttribute("src");
                    if (!src) return;
                    // Skip absolute URLs (http://, https://, data:, /api/)
                    if (/^https?:\/\/|^data:|^\/api\//.test(src)) return;
                    var resolved;
                    if (src.startsWith("/")) {
                        // Root-relative: strip leading slash
                        resolved = src.slice(1);
                    } else {
                        // Relative to the markdown file's directory
                        resolved = dir ? dir + "/" + src : src;
                        // Normalize . and .. segments
                        var parts = resolved.split("/");
                        var stack = [];
                        for (var i = 0; i < parts.length; i++) {
                            if (parts[i] === "." || parts[i] === "") continue;
                            if (parts[i] === ".." && stack.length > 0) {
                                stack.pop();
                            } else if (parts[i] !== "..") {
                                stack.push(parts[i]);
                            }
                        }
                        resolved = stack.join("/");
                    }
                    img.setAttribute("src", "/api/raw?path=" + encodeURIComponent(resolved));
                });
            }

            // Build index mapping basenames to full paths for wiki link resolution
            function buildWikiLinkIndex() {
                if (wikiLinkIndex && allFiles) return wikiLinkIndex;
                if (!allFiles) return null;

                wikiLinkIndex = {};
                allFiles.forEach(function(path) {
                    var basename = path.split('/').pop();
                    var nameNoExt = basename.replace(/\.md$/i, '');

                    // Index by name without extension
                    if (!wikiLinkIndex[nameNoExt.toLowerCase()]) {
                        wikiLinkIndex[nameNoExt.toLowerCase()] = [];
                    }
                    wikiLinkIndex[nameNoExt.toLowerCase()].push(path);

                    // Also index by full basename
                    if (!wikiLinkIndex[basename.toLowerCase()]) {
                        wikiLinkIndex[basename.toLowerCase()] = [];
                    }
                    wikiLinkIndex[basename.toLowerCase()].push(path);
                });
                return wikiLinkIndex;
            }

            // Resolve wiki link target to actual file path
            function resolveWikiTarget(target, currentDir) {
                var index = buildWikiLinkIndex();
                if (!index) return null;

                // Normalize target
                var normalizedTarget = target.trim();

                // Try exact path match first
                if (allFiles.indexOf(normalizedTarget) !== -1) {
                    return normalizedTarget;
                }
                // Try with .md extension
                if (allFiles.indexOf(normalizedTarget + '.md') !== -1) {
                    return normalizedTarget + '.md';
                }

                // Try basename lookup
                var basename = normalizedTarget.split('/').pop().toLowerCase();
                var candidates = index[basename] || index[basename.replace(/\.md$/i, '')] || [];

                if (candidates.length === 0) return null;
                if (candidates.length === 1) return candidates[0];

                // Multiple matches: prefer same directory
                var sameDirMatch = candidates.find(function(c) {
                    var dir = c.split('/').slice(0, -1).join('/');
                    return dir === currentDir;
                });
                if (sameDirMatch) return sameDirMatch;

                // Otherwise return shortest path
                candidates.sort(function(a, b) { return a.length - b.length; });
                return candidates[0];
            }

            // Resolve all wiki links in a container
            function resolveWikiLinks(container, currentFilePath) {
                var currentDir = currentFilePath.split('/').slice(0, -1).join('/');
                var links = container.querySelectorAll('a.wiki-link');
                var images = container.querySelectorAll('img.wiki-image');

                if (links.length === 0 && images.length === 0) return;

                // Ensure file list is loaded for resolution
                if (!allFiles) {
                    apiFetch('/api/files').then(function(result) {
                        if (result.ok) {
                            allFiles = result.data;
                            wikiLinkIndex = null;
                            resolveWikiLinksInner(links, currentDir);
                            resolveWikiImagesInner(images, currentDir);
                        }
                    });
                } else {
                    resolveWikiLinksInner(links, currentDir);
                    resolveWikiImagesInner(images, currentDir);
                }
            }

            function resolveWikiImagesInner(images, currentDir) {
                images.forEach(function(img) {
                    var target = img.dataset.wikiTarget;
                    var resolved = resolveWikiTarget(target, currentDir);
                    if (resolved) {
                        img.src = '/api/raw?path=' + encodeURIComponent(resolved);
                        img.classList.add('wiki-image-valid');
                    } else {
                        img.classList.add('wiki-image-broken');
                        img.alt = img.alt + ' [not found]';
                        img.title = 'File not found: ' + target;
                    }
                });
            }

            // Convert heading text to slug format (same as addHeadingAnchors)
            function slugifyHeading(text) {
                return text.toLowerCase().replace(/[^\w]+/g, '-').replace(/^-|-$/g, '');
            }

            function resolveWikiLinksInner(links, currentDir) {
                links.forEach(function(link) {
                    var target = link.dataset.wikiTarget;
                    var heading = link.dataset.wikiHeading || '';
                    var headingSlug = heading ? slugifyHeading(heading) : '';
                    var resolved = resolveWikiTarget(target, currentDir);

                    if (resolved) {
                        link.href = '/' + resolved + (headingSlug ? '#' + headingSlug : '');
                        link.classList.add('wiki-link-valid');
                        link.onclick = async function(e) {
                            e.preventDefault();
                            await loadFile(resolved);
                            if (headingSlug) {
                                // Update URL to include the hash
                                history.replaceState(null, '', location.pathname + '#' + headingSlug);
                                var h = document.getElementById(headingSlug);
                                if (h) h.scrollIntoView({ behavior: 'smooth' });
                            }
                        };
                    } else {
                        link.classList.add('wiki-link-broken');
                        link.title = 'File not found: ' + target;
                    }
                });
            }

            function bindAnchorLinks(container) {
                container
                    .querySelectorAll('a[href^="#"]:not(.wiki-link)')
                    .forEach(function (link) {
                        link.onclick = function (e) {
                            var id = link.getAttribute("href").slice(1);
                            var target = document.getElementById(id);
                            if (target) {
                                e.preventDefault();
                                target.scrollIntoView({ behavior: "smooth" });
                            }
                        };
                    });
            }

            function addHeadingAnchors(container) {
                var linkIcon =
                    '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z"/></svg>';
                container
                    .querySelectorAll("h1, h2, h3, h4, h5, h6")
                    .forEach(function (h) {
                        if (h.querySelector(".heading-anchor")) return; // Already has anchor
                        var id = h.id;
                        if (!id) {
                            id = slugifyHeading(h.textContent);
                            h.id = id;
                        }
                        var anchor = document.createElement("a");
                        anchor.className = "heading-anchor";
                        anchor.href = "#" + id;
                        anchor.innerHTML = linkIcon;
                        anchor.setAttribute("aria-hidden", "true");
                        anchor.onclick = function (e) {
                            e.preventDefault();
                            history.pushState(null, "", "#" + id);
                            h.scrollIntoView({ behavior: "smooth" });
                        };
                        h.appendChild(anchor);
                    });
            }

            /* ── Collapsible sections ────────────────────────────────── */
            function getCollapseStorageKey(filePath) {
                return 'collapsedSections:' + filePath;
            }

            function loadCollapseState(filePath) {
                try {
                    var data = localStorage.getItem(getCollapseStorageKey(filePath));
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    return [];
                }
            }

            function saveCollapseState(filePath, collapsedIds) {
                try {
                    if (collapsedIds.length === 0) {
                        localStorage.removeItem(getCollapseStorageKey(filePath));
                    } else {
                        localStorage.setItem(getCollapseStorageKey(filePath), JSON.stringify(collapsedIds));
                    }
                } catch (e) {
                    // Ignore storage errors
                }
            }

            function getCollapsedIds(container) {
                var ids = [];
                container.querySelectorAll('.heading-section.collapsed').forEach(function(section) {
                    var heading = section.querySelector('h1, h2, h3, h4, h5, h6');
                    if (heading && heading.id) {
                        ids.push(heading.id);
                    }
                });
                return ids;
            }

            function toggleSection(section, filePath) {
                section.classList.toggle('collapsed');
                var container = section.closest('.markdown-body');
                if (container) {
                    saveCollapseState(filePath, getCollapsedIds(container));
                }
            }

            function expandSectionForElement(element) {
                var parent = element.closest('.heading-section');
                while (parent) {
                    parent.classList.remove('collapsed');
                    parent = parent.parentElement ? parent.parentElement.closest('.heading-section') : null;
                }
            }

            function collapseAllSections(container, filePath) {
                container.querySelectorAll('.heading-section').forEach(function(section) {
                    section.classList.add('collapsed');
                });
                saveCollapseState(filePath, getCollapsedIds(container));
            }

            function expandAllSections(container, filePath) {
                container.querySelectorAll('.heading-section.collapsed').forEach(function(section) {
                    section.classList.remove('collapsed');
                });
                saveCollapseState(filePath, []);
            }

            function renderMermaidDiagrams(container) {
                var codeBlocks = container.querySelectorAll('code.language-mermaid');
                codeBlocks.forEach(function(code) {
                    var pre = code.parentElement;
                    var diagram = document.createElement('div');
                    diagram.className = 'mermaid';
                    diagram.setAttribute('data-original', code.textContent);
                    diagram.textContent = code.textContent;
                    pre.parentNode.replaceChild(diagram, pre);
                });
                if (codeBlocks.length > 0) {
                    mermaid.run();
                }
            }

            function wrapCollapsibleSections(container, filePath) {
                var headings = Array.from(container.querySelectorAll('h1, h2, h3, h4, h5, h6'));
                if (headings.length === 0) return;

                var collapsedIds = loadCollapseState(filePath);

                // Process headings in reverse order to handle nesting correctly
                for (var i = headings.length - 1; i >= 0; i--) {
                    var heading = headings[i];
                    var level = parseInt(heading.tagName.charAt(1));

                    // Collect content until next heading of same or higher level
                    var contentNodes = [];
                    var sibling = heading.nextSibling;
                    while (sibling) {
                        if (sibling.nodeType === 1) {
                            // Check if it's a heading of same or higher level
                            var siblingTag = sibling.tagName;
                            if (/^H[1-6]$/.test(siblingTag)) {
                                var siblingLevel = parseInt(siblingTag.charAt(1));
                                if (siblingLevel <= level) break;
                            }
                            // Check if it's a heading-section with same or higher level
                            if (sibling.classList && sibling.classList.contains('heading-section')) {
                                var sectionHeading = sibling.querySelector('h1, h2, h3, h4, h5, h6');
                                if (sectionHeading) {
                                    var sectionLevel = parseInt(sectionHeading.tagName.charAt(1));
                                    if (sectionLevel <= level) break;
                                }
                            }
                        }
                        contentNodes.push(sibling);
                        sibling = sibling.nextSibling;
                    }

                    // Create section wrapper
                    var section = document.createElement('div');
                    section.className = 'heading-section';

                    // Restore collapsed state
                    if (collapsedIds.indexOf(heading.id) !== -1) {
                        section.classList.add('collapsed');
                    }

                    // Insert section before heading
                    heading.parentNode.insertBefore(section, heading);

                    // Move heading into section
                    section.appendChild(heading);

                    // Add toggle button to heading
                    var toggle = document.createElement('button');
                    toggle.className = 'heading-toggle';
                    toggle.innerHTML = SVG.collapseToggle;
                    toggle.setAttribute('aria-label', 'Toggle section');
                    toggle.onclick = function(sec) {
                        return function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            toggleSection(sec, filePath);
                        };
                    }(section);
                    heading.insertBefore(toggle, heading.firstChild);

                    // Create content wrapper if there's content
                    if (contentNodes.length > 0) {
                        var contentWrapper = document.createElement('div');
                        contentWrapper.className = 'heading-section-content';
                        var inner = document.createElement('div');
                        inner.className = 'heading-section-inner';
                        contentWrapper.appendChild(inner);
                        section.appendChild(contentWrapper);

                        // Move content nodes
                        contentNodes.forEach(function(node) {
                            inner.appendChild(node);
                        });
                    }
                }
            }

            /* ── Outline sidebar ──────────────────────────────────────── */
            var outlineBtn = null;

            function buildOutline(container) {
                var sidebar = document.getElementById("outline-sidebar");
                var content = sidebar.querySelector(".outline-content");
                var headings = container.querySelectorAll(
                    "h1, h2, h3, h4, h5, h6",
                );

                if (headings.length < 2) {
                    content.innerHTML =
                        '<div class="outline-empty">No headings found</div>';
                    return false;
                }

                var html = '<ul class="outline-list">';
                headings.forEach(function (h) {
                    var level = parseInt(h.tagName.charAt(1));
                    var id =
                        h.id ||
                        h.textContent.toLowerCase().replace(/[^\w]+/g, "-");
                    if (!h.id) h.id = id;
                    var text = h.textContent;
                    html +=
                        '<li><a class="outline-link outline-h' +
                        level +
                        '" href="#' +
                        escAttr(id) +
                        '" onclick="onOutlineLinkClick(event)">' +
                        esc(text) +
                        "</a></li>";
                });
                html += "</ul>";
                content.innerHTML = html;
                return true;
            }

            function onOutlineLinkClick(e) {
                e.preventDefault();
                var id = e.target.getAttribute("href").slice(1);
                var target = document.getElementById(id);
                if (target) {
                    expandSectionForElement(target);
                    // Save state after expanding
                    var mdBody = document.querySelector('.markdown-body');
                    if (mdBody && currentFilePath) {
                        saveCollapseState(currentFilePath, getCollapsedIds(mdBody));
                    }
                    history.pushState(null, "", "#" + id);
                    target.scrollIntoView({ behavior: "smooth" });
                    // Close outline on mobile after clicking a link
                    if (window.innerWidth <= 768) {
                        hideOutline();
                        localStorage.setItem("outlineOpen", "0");
                    }
                }
            }

            function toggleOutline() {
                var sidebar = document.getElementById("outline-sidebar");
                var isOpen = sidebar.classList.toggle("open");
                if (outlineBtn) {
                    outlineBtn.classList.toggle("active", isOpen);
                }
                localStorage.setItem("outlineOpen", isOpen ? "1" : "0");
            }

            function showOutline() {
                var sidebar = document.getElementById("outline-sidebar");
                sidebar.classList.add("open");
                if (outlineBtn) outlineBtn.classList.add("active");
            }

            function hideOutline() {
                var sidebar = document.getElementById("outline-sidebar");
                sidebar.classList.remove("open");
                if (outlineBtn) outlineBtn.classList.remove("active");
            }

            function createOutlineButton() {
                var btn = document.createElement("button");
                btn.className = "outline-btn";
                btn.innerHTML =
                    '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M7.75 2.5a.75.75 0 0 0 0 1.5h6.5a.75.75 0 0 0 0-1.5h-6.5Zm0 5a.75.75 0 0 0 0 1.5h6.5a.75.75 0 0 0 0-1.5h-6.5Zm0 5a.75.75 0 0 0 0 1.5h6.5a.75.75 0 0 0 0-1.5h-6.5ZM2.5 2.75a.75.75 0 0 1 .75-.75h.5a.75.75 0 0 1 0 1.5h-.5a.75.75 0 0 1-.75-.75Zm.75 4.25a.75.75 0 0 0 0 1.5h.5a.75.75 0 0 0 0-1.5h-.5Zm0 5a.75.75 0 0 0 0 1.5h.5a.75.75 0 0 0 0-1.5h-.5Z"/></svg>Outline';
                btn.onclick = toggleOutline;
                return btn;
            }

            function getViewParam() {
                var params = new URLSearchParams(location.search);
                return params.get("view");
            }

            function setViewParam(view) {
                var params = new URLSearchParams(location.search);
                if (view) {
                    params.set("view", view);
                } else {
                    params.delete("view");
                }
                var qs = params.toString();
                var url = location.pathname + (qs ? "?" + qs : "");
                history.replaceState(null, "", url);
            }

            // ── PDF Viewer ─────────────────────────────────────────────
            function renderPDF(path, data) {
                var area = document.getElementById("content-area");
                var rawURL = "/api/raw?path=" + encodeURIComponent(path);
                area.innerHTML = '<div class="pdf-viewer"><embed src="' + escAttr(rawURL) + '" type="application/pdf"></div>';
            }

            async function loadFile(path, skipPush) {
                closeSidebar();
                currentFileIsText = false;
                // Unwatch old file
                if (currentFilePath) wsUnwatch(currentFilePath);

                currentFilePath = path;
                currentPath = path.includes("/")
                    ? path.substring(0, path.lastIndexOf("/"))
                    : "";
                if (!skipPush) pushURL(path);
                updateBreadcrumb(path);

                // Hide file header bar initially (will show after loading)
                hideFileHeaderBar();

                // Expand parent dirs in sidebar
                var parts = path.split("/");
                var accumulated = "";
                for (var i = 0; i < parts.length - 1; i++) {
                    accumulated = accumulated
                        ? accumulated + "/" + parts[i]
                        : parts[i];
                    if (!expandedDirs.has(accumulated)) {
                        expandedDirs.add(accumulated);
                        await fetchTree(accumulated);
                        wsWatch(accumulated);
                    }
                }

                var resultCode = getAsParam();
                var result = await apiFetch(
                    "/api/file?path=" +
                        encodeURIComponent(path) +
                        (resultCode ? "&as=" + encodeURIComponent(resultCode) : ""),
                );
                if (!result.ok) {
                    var area = document.getElementById("content-area");
                    if (result.isNetworkError) {
                        area.innerHTML =
                            '<div class="welcome"><h2>Unable to load file</h2><p>The server may have stopped. Click Retry above to reconnect.</p></div>';
                    } else if (result.status === 404) {
                        area.innerHTML =
                            '<div class="welcome"><h2>File not found</h2><p>The file <code>' +
                            esc(path) +
                            "</code> does not exist or was removed.</p></div>";
                    } else {
                        area.innerHTML =
                            '<div class="welcome"><h2>Error loading file</h2><p>' +
                            esc(result.error || "Unknown error") +
                            "</p></div>";
                    }
                    return;
                }
                var data = result.data;

                var area = document.getElementById("content-area");

                // Files exceeding the inline size cap: offer a download
                // through /api/raw instead of rendering.
                if (data.tooLarge) {
                    var bigURL = "/api/raw?path=" + encodeURIComponent(path);
                    var bigName = data.name || path.split("/").pop();
                    area.innerHTML =
                        '<div class="binary-info">' +
                        '<div class="binary-icon">&#128462;</div>' +
                        '<div class="binary-filename">' + esc(bigName) + "</div>" +
                        '<div class="binary-meta"><span>' + esc(formatFileSize(data.size)) + '</span><span>exceeds inline limit</span></div>' +
                        "<p>Large files are not rendered inline.</p>" +
                        '<a class="binary-download" href="' + escAttr(bigURL) + '" download="' + escAttr(bigName) + '">Download</a>' +
                        "</div>";
                    showFileHeaderBar(null, null);
                    wsWatch(path);
                    refreshTree();
                    document.title = bigName + " - RepoView";
                    return;
                }

                // Text files rendered inline support the "Read file as" menu.
                currentFileIsText = true;

                // Handle PDF files
                if (data.isPDF) {
                    if (getViewParam()) setViewParam(null);
                    renderPDF(path, data);

                    var sizeStr = formatFileSize(data.size);
                    var metaHTML = "<span>" + esc(sizeStr) + '</span><span class="sep">·</span><span>PDF</span>';
                    showFileHeaderBar(null, metaHTML);

                    wsWatch(path);
                    refreshTree();
                    var filename = path.split("/").pop();
                    document.title = filename + " - RepoView";
                    return;
                }

                // Handle JSONL files
                if (data.isJSONL) {
                    await renderJSONLViewer(path, data);
                    document.title = filename + " - RepoView";
                    return;
                }

                if (data.isBinary) {
                    // Strip ?view param for binary files
                    if (getViewParam()) setViewParam(null);
                    var rawURL = "/api/raw?path=" + encodeURIComponent(path);
                    var sizeStr = formatFileSize(data.size);
                    var mime = data.mimeType || "application/octet-stream";
                    var html = "";
                    if (mime.startsWith("image/")) {
                        html =
                            '<div class="binary-preview"><img src="' +
                            escAttr(rawURL) +
                            '" alt="' +
                            escAttr(data.name) +
                            '"></div>';
                        html += '<div class="binary-info">';
                        html +=
                            '<div class="binary-meta"><span>' +
                            esc(sizeStr) +
                            "</span><span>" +
                            esc(mime) +
                            "</span></div>";
                        html +=
                            '<a class="binary-download" href="' +
                            escAttr(rawURL) +
                            '" download="' +
                            escAttr(data.name) +
                            '">Download</a>';
                        html += "</div>";
                    } else if (mime.startsWith("video/")) {
                        html =
                            '<div class="binary-preview"><video controls src="' +
                            escAttr(rawURL) +
                            '"></video></div>';
                        html += '<div class="binary-info">';
                        html +=
                            '<div class="binary-meta"><span>' +
                            esc(sizeStr) +
                            "</span><span>" +
                            esc(mime) +
                            "</span></div>";
                        html +=
                            '<a class="binary-download" href="' +
                            escAttr(rawURL) +
                            '" download="' +
                            escAttr(data.name) +
                            '">Download</a>';
                        html += "</div>";
                    } else if (mime.startsWith("audio/")) {
                        html =
                            '<div class="binary-preview"><audio controls src="' +
                            escAttr(rawURL) +
                            '"></audio></div>';
                        html += '<div class="binary-info">';
                        html +=
                            '<div class="binary-meta"><span>' +
                            esc(sizeStr) +
                            "</span><span>" +
                            esc(mime) +
                            "</span></div>";
                        html +=
                            '<a class="binary-download" href="' +
                            escAttr(rawURL) +
                            '" download="' +
                            escAttr(data.name) +
                            '">Download</a>';
                        html += "</div>";
                    } else {
                        html = '<div class="binary-info">';
                        html += '<div class="binary-icon">&#128462;</div>';
                        html +=
                            '<div class="binary-filename">' +
                            esc(data.name) +
                            "</div>";
                        html +=
                            '<div class="binary-meta"><span>' +
                            esc(sizeStr) +
                            "</span><span>" +
                            esc(mime) +
                            "</span></div>";
                        html += "<p>Binary file not displayed</p>";
                        html +=
                            '<a class="binary-download" href="' +
                            escAttr(rawURL) +
                            '" download="' +
                            escAttr(data.name) +
                            '">Download</a>';
                        html += "</div>";
                    }
                    area.innerHTML = html;

                    // Show file header bar with metadata for binary files
                    var metaHTML =
                        "<span>" +
                        esc(sizeStr) +
                        '</span><span class="sep">·</span><span>' +
                        esc(mime) +
                        "</span>";
                    showFileHeaderBar(null, metaHTML);

                    wsWatch(path);
                    refreshTree();
                    var filename = path.split("/").pop();
                    document.title = filename + " - RepoView";
                    return;
                }
                if (data.isHTML) {
                    var rawSrc = "/api/raw?path=" + encodeURIComponent(path);
                    var previewEl = '<iframe class="html-preview" sandbox="allow-scripts" src="' + rawSrc + '"></iframe>';
                    var codeHTML = '<div class="source-code">' + data.rawContent + "</div>";
                    var wantCode = getViewParam() === "code";

                    area.innerHTML = wantCode ? codeHTML : previewEl;

                    var toggle = document.createElement("span");
                    toggle.className = "view-toggle";
                    var btnPreview = document.createElement("button");
                    btnPreview.textContent = "Preview";
                    btnPreview.className = wantCode ? "" : "active";
                    var btnCode = document.createElement("button");
                    btnCode.textContent = "Code";
                    btnCode.className = wantCode ? "active" : "";
                    toggle.appendChild(btnPreview);
                    toggle.appendChild(btnCode);

                    showFileHeaderBar(toggle, null);

                    btnPreview.onclick = function () {
                        area.innerHTML = previewEl;
                        btnPreview.className = "active";
                        btnCode.className = "";
                        setViewParam(null);
                    };
                    btnCode.onclick = function () {
                        area.innerHTML = codeHTML;
                        btnCode.className = "active";
                        btnPreview.className = "";
                        setViewParam("code");
                    };
                } else if (data.isMarkdown || data.isSVG) {
                    var previewHTML, codeHTML;
                    if (data.isMarkdown) {
                        previewHTML =
                            '<div class="markdown-body">' +
                            data.content +
                            "</div>";
                    } else {
                        previewHTML =
                            '<div class="svg-preview">' +
                            data.rawSVG +
                            "</div>";
                    }
                    codeHTML =
                        '<div class="source-code">' +
                        data.rawContent +
                        "</div>";
                    var wantCode = getViewParam() === "code";
                    var hasOutline = false;

                    function renderMarkdownPreview() {
                        area.innerHTML = previewHTML;
                        if (data.isMarkdown) {
                            bindAnchorLinks(area);
                            var mdBody = area.querySelector(".markdown-body");
                            if (mdBody) {
                                addHeadingAnchors(mdBody);
                                rewriteMarkdownImages(mdBody, path);
                                resolveWikiLinks(mdBody, path);
                                wrapCollapsibleSections(mdBody, currentFilePath);
                                renderMermaidDiagrams(mdBody);
                                hasOutline = buildOutline(mdBody);
                                if (
                                    hasOutline &&
                                    localStorage.getItem("outlineOpen") === "1"
                                ) {
                                    showOutline();
                                }
                                // Scroll to hash if present
                                if (location.hash) {
                                    var target = document.getElementById(
                                        location.hash.slice(1),
                                    );
                                    if (target) {
                                        expandSectionForElement(target);
                                        saveCollapseState(currentFilePath, getCollapsedIds(mdBody));
                                        setTimeout(function () {
                                            target.scrollIntoView();
                                        }, 50);
                                    }
                                }
                            }
                        }
                    }

                    if (wantCode) {
                        area.innerHTML = codeHTML;
                        hideOutline();
                    } else {
                        renderMarkdownPreview();
                    }

                    // Create toggle
                    var toggle = document.createElement("span");
                    toggle.className = "view-toggle";
                    var btnPreview = document.createElement("button");
                    btnPreview.textContent = "Preview";
                    btnPreview.className = wantCode ? "" : "active";
                    var btnCode = document.createElement("button");
                    btnCode.textContent = "Code";
                    btnCode.className = wantCode ? "active" : "";
                    toggle.appendChild(btnPreview);
                    toggle.appendChild(btnCode);

                    // Show file header bar with toggle and outline button for markdown
                    showFileHeaderBar(toggle, null);
                    if (data.isMarkdown && !wantCode) {
                        outlineBtn = createOutlineButton();
                        var actions = document.querySelector(
                            "#file-header-bar .file-header-actions",
                        );
                        // Insert outline button before edit button
                        actions.insertBefore(outlineBtn, actions.firstChild);
                        if (localStorage.getItem("outlineOpen") === "1") {
                            outlineBtn.classList.add("active");
                        }
                    }

                    btnPreview.onclick = function () {
                        renderMarkdownPreview();
                        btnPreview.className = "active";
                        btnCode.className = "";
                        setViewParam(null);
                        // Show outline button
                        if (data.isMarkdown) {
                            var actions = document.querySelector(
                                "#file-header-bar .file-header-actions",
                            );
                            // Remove old outline button if present
                            var oldOutline =
                                actions.querySelector(".outline-btn");
                            if (oldOutline) oldOutline.remove();
                            outlineBtn = createOutlineButton();
                            actions.insertBefore(
                                outlineBtn,
                                actions.firstChild,
                            );
                            if (
                                hasOutline &&
                                localStorage.getItem("outlineOpen") === "1"
                            ) {
                                outlineBtn.classList.add("active");
                                showOutline();
                            }
                        }
                    };
                    btnCode.onclick = function () {
                        area.innerHTML = codeHTML;
                        btnCode.className = "active";
                        btnPreview.className = "";
                        setViewParam("code");
                        hideOutline();
                        // Hide outline button (keep edit button)
                        var actions = document.querySelector(
                            "#file-header-bar .file-header-actions",
                        );
                        var oldOutline = actions.querySelector(".outline-btn");
                        if (oldOutline) oldOutline.remove();
                        outlineBtn = null;
                    };
                } else if (data.isCSV) {
                    var recordsHTML = null;
                    var wantRecords = getViewParam() === "records";

                    // Parse the CSV once; filtering shares it (and Charts do).
                    var csvParsed = null; // { headers, rows: [{cells, orig}] }
                    function getParsedCSV() {
                        if (csvParsed) return csvParsed;
                        var parsed = parseCSVAll(data.rawCSV);
                        var rowsAll = [];
                        for (var i = 1; i < parsed.length; i++) {
                            rowsAll.push({ cells: parsed[i], orig: i });
                        }
                        csvParsed = {
                            headers: parsed.length ? parsed[0] : [],
                            rows: rowsAll,
                        };
                        return csvParsed;
                    }

                    var csvFilters = []; // [{col, op, value}]
                    var csvFilterMode = "all";

                    // Server-rendered table is the unfiltered baseline.
                    var csvTableEl = document.createElement("div");
                    csvTableEl.className = "csv-table";
                    csvTableEl.innerHTML = data.content;

                    // ── Filter bar ──
                    var filterBar = document.createElement("div");
                    filterBar.className = "csv-filter-bar";

                    var colSelect = document.createElement("select");
                    colSelect.className = "csv-filter-col";
                    var colOptions = getParsedCSV().headers;
                    for (var ci = 0; ci < colOptions.length; ci++) {
                        var colOpt = document.createElement("option");
                        colOpt.value = String(ci);
                        colOpt.textContent = colOptions[ci];
                        colSelect.appendChild(colOpt);
                    }

                    var opSelect = document.createElement("select");
                    opSelect.className = "csv-filter-op";
                    [
                        ["contains", "contains"],
                        ["equals", "equals"],
                        ["regex", "regex"],
                        ["gt", ">"],
                        ["lt", "<"],
                        ["empty", "is empty"],
                        ["not-empty", "not empty"],
                    ].forEach(function (pair) {
                        var opt = document.createElement("option");
                        opt.value = pair[0];
                        opt.textContent = pair[1];
                        opSelect.appendChild(opt);
                    });

                    var valInput = document.createElement("input");
                    valInput.className = "csv-filter-value";
                    valInput.placeholder = "Value…";
                    valInput.type = "text";

                    var invalidMsg = document.createElement("span");
                    invalidMsg.className = "csv-filter-invalid";

                    var addBtn = document.createElement("button");
                    addBtn.className = "csv-filter-add";
                    addBtn.textContent = "+ Add";
                    addBtn.onclick = function () {
                        var col = parseInt(colSelect.value, 10);
                        var op = opSelect.value;
                        var value = valInput.value;
                        if (
                            (op === "contains" || op === "equals" || op === "regex" || op === "gt" || op === "lt") &&
                            value === ""
                        ) {
                            invalidMsg.textContent = "enter a value";
                            return;
                        }
                        if (op === "regex") {
                            try {
                                new RegExp(value, "i");
                            } catch (e) {
                                invalidMsg.textContent = "invalid regex: " + e.message;
                                return;
                            }
                        }
                        invalidMsg.textContent = "";
                        csvFilters.push({ col: col, op: op, value: value });
                        valInput.value = "";
                        renderChips();
                        applyFilters();
                    };

                    valInput.addEventListener("keydown", function (e) {
                        if (e.key === "Enter") {
                            e.preventDefault();
                            addBtn.onclick();
                        }
                    });

                    var modeAllBtn = document.createElement("button");
                    modeAllBtn.className = "csv-filter-mode active";
                    modeAllBtn.textContent = "match all";
                    var modeAnyBtn = document.createElement("button");
                    modeAnyBtn.className = "csv-filter-mode";
                    modeAnyBtn.textContent = "match any";
                    modeAllBtn.onclick = function () {
                        csvFilterMode = "all";
                        modeAllBtn.className = "csv-filter-mode active";
                        modeAnyBtn.className = "csv-filter-mode";
                        applyFilters();
                    };
                    modeAnyBtn.onclick = function () {
                        csvFilterMode = "any";
                        modeAnyBtn.className = "csv-filter-mode active";
                        modeAllBtn.className = "csv-filter-mode";
                        applyFilters();
                    };

                    var clearBtn = document.createElement("button");
                    clearBtn.className = "csv-filter-clear";
                    clearBtn.textContent = "Clear";
                    clearBtn.onclick = function () {
                        csvFilters = [];
                        renderChips();
                        applyFilters();
                    };

                    var countEl = document.createElement("span");
                    countEl.className = "csv-filter-count";

                    var chipsWrap = document.createElement("div");
                    chipsWrap.className = "csv-filter-chips";

                    filterBar.appendChild(colSelect);
                    filterBar.appendChild(opSelect);
                    filterBar.appendChild(valInput);
                    filterBar.appendChild(addBtn);
                    filterBar.appendChild(invalidMsg);
                    filterBar.appendChild(clearBtn);
                    filterBar.appendChild(countEl);

                    var csvView = document.createElement("div");
                    csvView.className = "csv-view";
                    csvView.appendChild(filterBar);
                    csvView.appendChild(chipsWrap);
                    csvView.appendChild(csvTableEl);

                    area.innerHTML = "";
                    area.appendChild(csvView);

                    // Create toggle
                    var toggle = document.createElement("span");
                    toggle.className = "view-toggle";
                    var wantCharts = getViewParam() === "charts";
                    var btnTable = document.createElement("button");
                    btnTable.textContent = "Table";
                    btnTable.className = wantRecords || wantCharts ? "" : "active";
                    var btnRecords = document.createElement("button");
                    btnRecords.textContent = "Records";
                    btnRecords.className = wantRecords ? "active" : "";
                    var btnCharts = document.createElement("button");
                    btnCharts.textContent = "Charts";
                    btnCharts.className = wantCharts ? "active" : "";
                    toggle.appendChild(btnTable);
                    toggle.appendChild(btnRecords);
                    toggle.appendChild(btnCharts);
                    showFileHeaderBar(toggle, null);

                    var csvActiveView = wantRecords ? "records" : wantCharts ? "charts" : "table";

                    /* ── Charts view ── config bar + one hand-rolled SVG ── */
                    var chartBar = document.createElement("div");
                    chartBar.className = "csv-filter-bar csv-chart-bar";

                    var chartTypeSel = document.createElement("select");
                    chartTypeSel.className = "csv-chart-type";
                    [
                        ["bar", "Bar"],
                        ["hbar", "Bar (horizontal)"],
                        ["stacked", "Stacked bar"],
                        ["line", "Line"],
                        ["area", "Area"],
                        ["scatter", "Scatter"],
                        ["pie", "Pie"],
                        ["donut", "Donut"],
                    ].forEach(function (p) {
                        var o = document.createElement("option");
                        o.value = p[0];
                        o.textContent = p[1];
                        chartTypeSel.appendChild(o);
                    });

                    var chartXSel = document.createElement("select");
                    chartXSel.className = "csv-chart-x";
                    var chartMSel = document.createElement("select");
                    chartMSel.className = "csv-chart-measure";
                    var chartAggSel = document.createElement("select");
                    chartAggSel.className = "csv-chart-agg";
                    ["sum", "avg", "min", "max", "count"].forEach(function (a) {
                        var o = document.createElement("option");
                        o.value = a;
                        o.textContent = a === "count" ? "count (rows)" : a;
                        chartAggSel.appendChild(o);
                    });
                    var chartBySel = document.createElement("select");
                    chartBySel.className = "csv-chart-color";

                    var chartNote = document.createElement("span");
                    chartNote.className = "csv-chart-note";

                    var chartLegend = document.createElement("div");
                    chartLegend.className = "chart-legend";

                    var chartBox = document.createElement("div");
                    chartBox.className = "csv-chart-box";

                    var chartView = document.createElement("div");
                    chartView.className = "csv-chart-view";
                    chartView.appendChild(chartBar);
                    chartView.appendChild(chartLegend);
                    chartView.appendChild(chartBox);

                    function fillColumnSelects() {
                        var parsed = getParsedCSV();
                        var headers = parsed.headers;
                        [chartXSel, chartMSel, chartBySel].forEach(function (
                            sel,
                        ) {
                            sel.innerHTML = "";
                        });
                        var numericCols = [];
                        headers.forEach(function (h, i) {
                            if (hasNumericCells(parsed.rows, i)) {
                                numericCols.push(i);
                            }
                            var label = h == null || h === "" ? "column " + (i + 1) : String(h);
                            var ox = document.createElement("option");
                            ox.value = String(i);
                            ox.textContent = label;
                            chartXSel.appendChild(ox);
                            var om = document.createElement("option");
                            om.value = String(i);
                            om.textContent = label;
                            chartMSel.appendChild(om);
                            var ob = document.createElement("option");
                            ob.value = String(i);
                            ob.textContent = label;
                            chartBySel.appendChild(ob);
                        });
                        // Measure list: numeric columns only.
                        for (
                            var mi = chartMSel.options.length - 1;
                            mi >= 0;
                            mi--
                        ) {
                            if (!hasNumericCells(
                                parsed.rows,
                                parseInt(chartMSel.options[mi].value, 10),
                            )) {
                                chartMSel.remove(mi);
                            }
                        }
                        var blank = document.createElement("option");
                        blank.value = "";
                        blank.textContent = "(none)";
                        chartBySel.appendChild(blank);
                        // Defaults on first open.
                        if (!chartCfg) {
                            chartCfg = {
                                type: "bar",
                                x: headers.length ? 0 : null,
                                m: numericCols.length ? numericCols[0] : null,
                                agg: "sum",
                                by: null,
                            };
                        }
                        if (chartXSel.querySelector('option[value="' + chartCfg.x + '"]')) {
                            chartXSel.value = String(chartCfg.x);
                        } else if (chartXSel.options.length) {
                            chartXSel.selectedIndex = 0;
                            chartCfg.x = parseInt(chartXSel.value, 10);
                        }
                        if (
                            chartCfg.m != null &&
                            chartMSel.querySelector('option[value="' + chartCfg.m + '"]')
                        ) {
                            chartMSel.value = String(chartCfg.m);
                        } else if (chartMSel.options.length) {
                            chartMSel.selectedIndex = 0;
                            chartCfg.m = parseInt(chartMSel.value, 10);
                        } else {
                            chartCfg.m = null;
                        }
                    }

                    var chartCfg = null;

                    function renderChartInto() {
                        var parsed = getParsedCSV();
                        fillColumnSelects();
                        chartTypeSel.value = chartCfg.type;
                        if (chartXSel.querySelector('option[value="' + chartCfg.x + '"]')) {
                            chartXSel.value = String(chartCfg.x);
                        }
                        if (chartCfg.m != null && chartMSel.querySelector('option[value="' + chartCfg.m + '"]')) {
                            chartMSel.value = String(chartCfg.m);
                        }
                        chartAggSel.value = chartCfg.agg;
                        chartBySel.value = chartCfg.by == null ? "" : String(chartCfg.by);

                        var indices = csvFilteredIndices(
                            parsed.rows,
                            csvFilters,
                            csvFilterMode,
                        );
                        var res = renderCSVChart(parsed, indices, chartCfg);
                        chartLegend.innerHTML = res.legend || "";
                        if (res.empty) {
                            chartBox.innerHTML =
                                '<div class="csv-chart-empty">' + esc(res.empty) + "</div>";
                            chartNote.textContent = "";
                            return;
                        }
                        chartBox.innerHTML = res.svg;
                        var plotted = indices.length;
                        chartNote.textContent =
                            "plotting " + plotted + " of " + parsed.rows.length + " rows";
                    }

                    chartTypeSel.onchange = function () {
                        chartCfg.type = chartTypeSel.value;
                        renderChartInto();
                    };
                    chartXSel.onchange = function () {
                        chartCfg.x = parseInt(chartXSel.value, 10);
                        renderChartInto();
                    };
                    chartMSel.onchange = function () {
                        chartCfg.m = chartMSel.value === "" ? null : parseInt(chartMSel.value, 10);
                        renderChartInto();
                    };
                    chartAggSel.onchange = function () {
                        chartCfg.agg = chartAggSel.value;
                        renderChartInto();
                    };
                    chartBySel.onchange = function () {
                        chartCfg.by = chartBySel.value === "" ? null : parseInt(chartBySel.value, 10);
                        renderChartInto();
                    };

                    chartBar.appendChild(chartTypeSel);
                    chartBar.appendChild(chartXSel);
                    chartBar.appendChild(chartMSel);
                    chartBar.appendChild(chartAggSel);
                    chartBar.appendChild(chartBySel);
                    chartBar.appendChild(chartNote);

                    function renderChips() {
                        chipsWrap.innerHTML = "";
                        if (csvFilters.length === 0) {
                            chipsWrap.style.display = "none";
                            clearBtn.style.display = "none";
                            return;
                        }
                        chipsWrap.style.display = "";
                        clearBtn.style.display = "";
                        var headers = getParsedCSV().headers;
                        csvFilters.forEach(function (f, idx) {
                            var chip = document.createElement("button");
                            chip.className = "csv-filter-chip";
                            var opLabel =
                                { contains: "contains", equals: "=",
                                  regex: "~", gt: ">", lt: "<",
                                  empty: "empty", "not-empty": "set" }[f.op] || f.op;
                            chip.innerHTML =
                                "<span>" +
                                esc(headers[f.col] || "?") +
                                "</span><strong>" +
                                esc(opLabel) +
                                "</strong>" +
                                (f.op === "empty" || f.op === "not-empty"
                                    ? ""
                                    : "<code>" + esc(f.value) + "</code>");
                            function removeFilter() {
                                csvFilters.splice(idx, 1);
                                renderChips();
                                applyFilters();
                            }
                            // Clicking the chip (or its ✕) removes the filter.
                            chip.onclick = removeFilter;
                            var xbtn = document.createElement("span");
                            xbtn.className = "csv-filter-chip-x";
                            xbtn.textContent = "✕";
                            xbtn.onclick = function (e) {
                                e.stopPropagation();
                                removeFilter();
                            };
                            chip.appendChild(xbtn);
                            chipsWrap.appendChild(chip);
                        });
                        var modeSeg = document.createElement("span");
                        modeSeg.className = "csv-filter-modes";
                        modeSeg.appendChild(modeAllBtn);
                        modeSeg.appendChild(modeAnyBtn);
                        chipsWrap.appendChild(modeSeg);
                    }

                    function applyFilters() {
                        var parsed = getParsedCSV();
                        var indices = csvFilteredIndices(
                            parsed.rows,
                            csvFilters,
                            csvFilterMode,
                        );
                        if (csvFilters.length === 0) {
                            // Restore the server-rendered table verbatim.
                            csvTableEl.innerHTML = data.content;
                        } else {
                            var shown = [];
                            indices.forEach(function (i) {
                                shown.push(parsed.rows[i]);
                            });
                            csvTableEl.innerHTML = renderCSVTableHTML(
                                parsed.headers,
                                shown,
                            );
                        }
                        if (csvFilters.length) {
                            countEl.textContent =
                                "Showing " + indices.length + " of " + parsed.rows.length + " rows";
                            countEl.style.display = "";
                        } else {
                            countEl.style.display = "none";
                        }
                        bindRowLinkClicks();
                        if (csvActiveView === "charts") {
                            renderChartInto();
                        }
                    }

                    function showRecords() {
                        if (!recordsHTML && data.rawCSV) {
                            var rows = parseCSVAll(data.rawCSV);
                            if (rows.length > 0) {
                                var headers = rows[0];
                                var dataRows = rows.slice(1);
                                recordsHTML = renderCSVRecords(
                                    headers,
                                    dataRows,
                                );
                            } else {
                                recordsHTML =
                                    '<div class="csv-records"><p>No records found</p></div>';
                            }
                        }
                        area.innerHTML =
                            recordsHTML ||
                            '<div class="csv-records"><p>No records found</p></div>';
                        var recordIdx = getRecordParam();
                        if (recordIdx) {
                            setTimeout(function () {
                                scrollToRecord(parseInt(recordIdx, 10));
                            }, 50);
                        }
                    }

                    function showTable() {
                        area.innerHTML = "";
                        // The filter toolbar and chips live inside csvView in
                        // the table view; showCharts() borrows them so the
                        // row set stays editable while charts are open.
                        csvView.insertBefore(filterBar, csvTableEl);
                        csvView.insertBefore(chipsWrap, csvTableEl);
                        area.appendChild(csvView);
                        btnTable.className = "active";
                        btnRecords.className = "";
                        btnCharts.className = "";
                        csvActiveView = "table";
                        bindRowLinkClicks();
                    }

                    function showCharts() {
                        area.innerHTML = "";
                        // Mount the shared filter toolbar + chips above the
                        // chart config so filters can be edited in place and
                        // charts re-render live via applyFilters().
                        chartView.insertBefore(filterBar, chartBar);
                        chartView.insertBefore(chipsWrap, chartBar);
                        area.appendChild(chartView);
                        btnTable.className = "";
                        btnRecords.className = "";
                        btnCharts.className = "active";
                        csvActiveView = "charts";
                        renderChartInto();
                    }

                    function switchToRecordsView(recordIndex) {
                        showRecords();
                        btnRecords.className = "active";
                        btnTable.className = "";
                        btnCharts.className = "";
                        csvActiveView = "records";
                        setViewParam("records");
                        setRecordParam(recordIndex);
                        setTimeout(function () {
                            scrollToRecord(recordIndex);
                        }, 50);
                    }

                    function bindRowLinkClicks() {
                        area.querySelectorAll(".csv-record-link-btn").forEach(
                            function (btn) {
                                btn.addEventListener("click", function (e) {
                                    e.stopPropagation();
                                    var rowIndex = parseInt(
                                        btn.dataset.row,
                                        10,
                                    );
                                    switchToRecordsView(rowIndex);
                                });
                            },
                        );
                    }

                    btnTable.onclick = function () {
                        showTable();
                        setViewParam(null);
                        setRecordParam(null);
                    };
                    btnRecords.onclick = function () {
                        showRecords();
                        btnRecords.className = "active";
                        btnTable.className = "";
                        btnCharts.className = "";
                        csvActiveView = "records";
                        setViewParam("records");
                    };
                    btnCharts.onclick = function () {
                        showCharts();
                        setViewParam("charts");
                        setRecordParam(null);
                    };

                    renderChips();
                    applyFilters();

                    if (wantRecords) {
                        showRecords();
                    } else if (getViewParam() === "charts") {
                        showCharts();
                    } else {
                        bindRowLinkClicks();
                    }
                } else if (data.isXML) {
                    renderXMLViewer(path, data);
                } else {
                    // Strip ?view param for non-toggle files
                    if (getViewParam()) setViewParam(null);
                    area.innerHTML =
                        '<div class="source-code">' + data.content + "</div>";

                    // Plain text files (.txt, and files read as plain text
                    // via ?as=txt) get wrap/line-number reading controls.
                    var isPlainText = /(\.txt$|as=txt)/i.test(location.search) || /\.txt$/i.test(path);
                    if (isPlainText) {
                        var preEl = area.querySelector("pre.plain-text");
                        if (preEl) {
                            var readToggle = document.createElement("span");
                            readToggle.className = "view-toggle";
                            var wrapOn =
                                localStorage.getItem("plainTextWrap") !== "0";
                            var numsOn =
                                localStorage.getItem("plainTextNumbers") === "1";
                            if (wrapOn) preEl.classList.add("wrap-on");
                            if (numsOn) preEl.classList.add("show-numbers");
                            var btnWrap = document.createElement("button");
                            btnWrap.textContent = "Wrap";
                            btnWrap.className = wrapOn ? "active" : "";
                            var btnNums = document.createElement("button");
                            btnNums.textContent = "Line numbers";
                            btnNums.className = numsOn ? "active" : "";
                            readToggle.appendChild(btnWrap);
                            readToggle.appendChild(btnNums);
                            btnWrap.onclick = function () {
                                var on = !preEl.classList.toggle("wrap-on");
                                btnWrap.className = on ? "active" : "";
                                localStorage.setItem(
                                    "plainTextWrap",
                                    on ? "1" : "0",
                                );
                            };
                            btnNums.onclick = function () {
                                var on = preEl.classList.toggle("show-numbers");
                                btnNums.className = on ? "active" : "";
                                localStorage.setItem(
                                    "plainTextNumbers",
                                    on ? "1" : "0",
                                );
                            };
                            showFileHeaderBar(readToggle, null);
                        } else {
                            showFileHeaderBar(null, null);
                        }
                    } else {
                        // Show file header bar without toggle for plain files
                        showFileHeaderBar(null, null);
                    }
                }

                // Update page title
                var filename = path.split("/").pop();
                document.title = filename + " - RepoView";

                wsWatch(path);
                refreshTree();
            }

            /* ── Breadcrumb ───────────────────────────────────────────── */
            function updateBreadcrumb(path) {
                var bc = document.getElementById("breadcrumb-path");
                if (!path) {
                    bc.innerHTML = "";
                    return;
                }
                var parts = path.split("/");
                var html = "";
                var accumulated = "";
                for (var i = 0; i < parts.length; i++) {
                    accumulated = accumulated
                        ? accumulated + "/" + parts[i]
                        : parts[i];
                    var isLast = i === parts.length - 1;
                    html += '<span class="sep">/</span>';
                    if (isLast) {
                        html +=
                            '<span class="crumb current">' +
                            esc(parts[i]) +
                            "</span>";
                    } else {
                        html +=
                            '<span class="crumb" data-nav="' +
                            escAttr(accumulated) +
                            '">' +
                            esc(parts[i]) +
                            "</span>";
                    }
                }
                bc.innerHTML = html;
                // Bind click handlers
                bc.querySelectorAll(".crumb[data-nav]").forEach(function (el) {
                    el.onclick = function () {
                        navigateTo(el.dataset.nav);
                    };

            /* ── Fuzzy Search ─────────────────────────────────────────── */
            async function openSearch() {
                document.getElementById("search-overlay").classList.add("open");
                var input = document.getElementById("search-input");
                input.value = "";
                input.focus();
                if (!allFiles) {
                    var result = await apiFetch("/api/files");
                    if (!result.ok) {
                        if (!result.isNetworkError) {
                            // API error - just close search, don't show connection banner
                            closeSearch();
                        }
                        return;
                    }
                    allFiles = result.data;
                }
                renderSearchResults(allFiles.slice(0, 50), false);
                searchIdx = 0;
                updateSearchSelection();

            function closeSearch() {
                document
                    .getElementById("search-overlay")
                    .classList.remove("open");
            }

            function onSearchInput() {
                var q = document.getElementById("search-input").value.trim();
                if (!allFiles) return;
                if (!q) {
                    renderSearchResults(allFiles.slice(0, 50), false);
                } else {
                    var results = fuzzysort(q, allFiles, 50);
                    renderSearchResults(results, true);
                }
                searchIdx = 0;
                updateSearchSelection();
            }

            function onSearchKey(e) {
                var results = document.querySelectorAll(".search-result");
                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    searchIdx = Math.min(searchIdx + 1, results.length - 1);
                    updateSearchSelection();
                } else if (e.key === "ArrowUp") {
                    e.preventDefault();
                    searchIdx = Math.max(searchIdx - 1, 0);
                    updateSearchSelection();
                } else if (e.key === "Enter") {
                    e.preventDefault();
                    if (results[searchIdx]) {
                        results[searchIdx].click();
                    }
                } else if (e.key === "Escape") {
                    closeSearch();
                }
            }

            function updateSearchSelection() {
                var items = document.querySelectorAll(".search-result");
                items.forEach(function (el, i) {
                    el.classList.toggle("selected", i === searchIdx);

                    items[searchIdx].scrollIntoView({ block: "nearest" });

                var container = document.getElementById("search-results");
                if (!items || items.length === 0) {
                    container.innerHTML =

                var html = "";

            /* ── Minimal fuzzysort implementation ─────────────────────── */
            function fuzzyMatchTerm(term, tl, target, startFrom) {
                var qi = 0,
                    score = 0,
                    consecutive = 0,
                    lastIdx = -1;
                var indices = [];
                for (
                    var ti = startFrom;
                    ti < tl.length && qi < term.length;
                    ti++
                ) {
                    if (tl[ti] === term[qi]) {
                        indices.push(ti);
                        consecutive = ti === lastIdx + 1 ? consecutive + 1 : 1;
                        score += consecutive + (ti === 0 ? 2 : 0);
                        if (
                            ti > 0 &&
                            (target[ti - 1] === "/" ||
                                target[ti - 1] === "." ||
                                target[ti - 1] === "-" ||
                                target[ti - 1] === "_")
                        )
                            score += 2;
                        lastIdx = ti;
                        qi++;
                    }
                }
                if (qi < term.length) return null;
                return { score: score, indices: indices };
            }

            function fuzzysort(query, targets, limit) {
                var terms = query
                    .toLowerCase()
                    .split(/\s+/)
                    .filter(function (t) {
                        return t.length > 0;
                    });
                if (terms.length === 0) return [];
                var scored = [];
                for (var t = 0; t < targets.length; t++) {
                    var target = targets[t];
                    var tl = target.toLowerCase();
                    var totalScore = 0,
                        allIndices = [],
                        matched = true;
                    for (var ti = 0; ti < terms.length; ti++) {
                        var m = fuzzyMatchTerm(terms[ti], tl, target, 0);
                        if (!m) {
                            matched = false;
                            break;
                        }
                        totalScore += m.score;
                        for (var k = 0; k < m.indices.length; k++)
                            allIndices.push(m.indices[k]);
                    }
                    if (matched) {
                        totalScore -= target.length * 0.1;
                        allIndices.sort(function (a, b) {
                            return a - b;
                        });
                        scored.push({
                            target: target,
                            score: totalScore,
                            indices: allIndices,
                        });
                    }
                }
                scored.sort(function (a, b) {
                    return b.score - a.score;
                });
                var results = scored.slice(0, limit);
                return results.map(function (r) {
                    var highlighted = "";
                    var last = 0;
                    var seen = {};
                    for (var j = 0; j < r.indices.length; j++) {
                        var idx = r.indices[j];
                        if (seen[idx]) continue;
                        seen[idx] = true;
                        if (idx < last) continue;
                        highlighted +=
                            esc(r.target.substring(last, idx)) +
                            "<mark>" +
                            esc(r.target[idx]) +
                            "</mark>";
                        last = idx + 1;
                    }
                    highlighted += esc(r.target.substring(last));
                    return { target: r.target, highlighted: highlighted };
                });
            }

            /* ── XML viewer ──────────────────────────────────────────── */
            // Tree/Table/Code views for XML files, parsed client-side with
            // DOMParser (no dependencies). Filter inputs reuse the
            // .csv-filter-* bar styles.

            function xmlGlobToRegExp(glob) {
                var escaped = glob.replace(/[.+^${}()|[\]\\]/g, "\\$&");
                return new RegExp(
                    "^" + escaped.replace(/\*/g, ".*").replace(/\?/g, ".") + "$",
                    "i",
                );
            }

            // xmlElementList flattens an XML document into entries with
            // dot-paths (root.book[deployment order agnostic]), attributes
            // and direct text content.
            function xmlElementList(doc) {
                var out = [];
                function walk(el, parentPath) {
